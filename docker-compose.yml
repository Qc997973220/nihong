version: '3.8'

services:
  neon:
    build: .
    network_mode: host
    volumes:
      - ./avatars:/app/avatars
      - ./application.properties:/app/application.properties
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_REDIS_HOST=127.0.0.1
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_PASSWORD=neon_redis_password_2026