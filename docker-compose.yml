version: '3.8'

services:
  nginx:
    # ...保持不变...
    network_mode: host  # 加上这一行，完全共享宿主机网络
    # ...注意：网络模式改为host后，容器内的76端口会直接暴露在宿主机80上
        
  neon:
    build: .
    container_name: neon-app
    network_mode: host   # 关键！加上这一行。
    volumes:
      - ./avatars:/app/avatars
      - ./uploads:/app/uploads
      - ./application.properties:/app/application.properties  # 这里必须放改好配置的文件
      - ./static:/app/static
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - QQ_MAIL_USERNAME=${QQ_MAIL_USERNAME}
      - QQ_MAIL_AUTH_CODE=${QQ_MAIL_AUTH_CODE}
    restart: unless-stopped
