<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 · NEON 霓虹之都</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- Font Awesome 6 免费版 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts：Inter + Orbitron -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            background: #0b0e14;
            color: #eef3fc;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                    linear-gradient(rgba(120, 180, 255, 0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(120, 180, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 1;
        }
        .float-contact {
            position: fixed;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 999;
        }
        .contact-btn {
            position: relative;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(90, 170, 255, 0.5);
            background: rgba(15, 30, 55, 0.8);
            backdrop-filter: blur(16px);
            box-shadow: 0 0 25px rgba(30, 136, 229, 0.3), 0 4px 12px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }
        .contact-btn i { font-size: 1.5rem; }
        .contact-btn:nth-child(1) { color: #07c160; }
        .contact-btn:nth-child(2) { color: #12b7f5; }
        .contact-btn:nth-child(3) { color: #ff6b6b; }
        .contact-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 0 35px rgba(30, 136, 229, 0.5), 0 6px 15px rgba(0, 0, 0, 0.5);
            border-color: #5a9eff;
        }
        .contact-popup {
            position: absolute;
            right: 70px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 30, 55, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(90, 170, 255, 0.4);
            border-radius: 16px;
            padding: 16px;
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .contact-btn:hover .contact-popup {
            opacity: 1;
            visibility: visible;
            right: 65px;
        }
        .contact-popup img {
            width: 160px;
            height: 160px;
            border-radius: 12px;
            display: block;
            margin: 0 auto 12px;
            border: 2px solid rgba(90, 170, 255, 0.3);
        }
        .contact-popup p {
            text-align: center;
            color: #a0bedd;
            margin: 0;
            font-size: 0.9rem;
        }
        .contact-popup .email-text {
            color: #5a9eff;
            font-size: 1rem;
            font-weight: 500;
            margin-top: 8px;
            font-family: 'Courier New', monospace;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 24px;
            width: 100%;
            flex: 1;
            position: relative;
            z-index: 10;
        }
        /* 导航栏 */
        .navbar {
            background: rgba(10, 17, 28, 0.6);
            backdrop-filter: blur(20px) saturate(200%);
            border-bottom: 1px solid rgba(90, 160, 255, 0.2);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            padding: 0 24px;
            max-width: 1300px;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 450;
            background: linear-gradient(135deg, #e0efff, #b2d9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
            filter: drop-shadow(0 0 8px #3f8eff);
            white-space: nowrap;
        }
        .back-link {
            color: #5ba5ff;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s, text-shadow 0.2s;
        }
        .back-link:hover {
            color: white;
            text-shadow: 0 0 8px #4d9eff;
        }
        /* 个人资料卡片 */
        .profile-card {
            background: rgba(20, 30, 50, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(90, 160, 255, 0.2);
            margin-top: 40px;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .avatar-container {
            position: relative;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(90, 160, 255, 0.3);
            box-shadow: 0 0 20px rgba(90, 160, 255, 0.3);
        }
        .avatar-placeholder {
            width: 120px;
            height: 120px;
            background: linear-gradient(145deg, #1e4f9e, #6d3fc9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 2.5rem;
            box-shadow: 0 0 20px #3f6eff;
        }
        .user-info h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #ffffff;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(95, 158, 255, 0.5);
        }
        .user-info p {
            margin: 5px 0;
            color: #90b0d1;
            font-size: 1.1rem;
        }
        .upload-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: rgba(91, 165, 255, 0.2);
            border: 1px solid rgba(91, 165, 255, 0.5);
            border-radius: 60px;
            color: #5ba5ff;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .upload-btn:hover {
            background: rgba(91, 165, 255, 0.3);
            border-color: #5ba5ff;
            box-shadow: 0 0 15px rgba(91, 165, 255, 0.5);
        }
        .file-input {
            display: none;
        }
        .info-section {
            margin-bottom: 30px;
        }
        .info-section h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(90, 160, 255, 0.2);
            padding-bottom: 10px;
            color: #b8dcff;
        }
        .info-item {
            display: flex;
            margin-bottom: 15px;
            align-items: center;
        }
        .info-label {
            width: 120px;
            font-weight: 600;
            color: #90b0d1;
        }
        .info-value {
            flex: 1;
            color: #eef3fc;
            font-size: 1.1rem;
        }
        .action-buttons {
            margin-top: 40px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 550;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(105deg, #1f4f9e, #2d6fc4);
            color: white;
            box-shadow: 0 5px 15px -5px #0a2a5a, 0 0 0 1px #5b9eff inset;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-primary:hover {
            background: linear-gradient(105deg, #2a5fb0, #3f82da);
            box-shadow: 0 0 30px #0077ff;
            transform: scale(1.02);
        }
        .btn-secondary {
            background: rgba(120, 120, 120, 0.3);
            color: #b0b0b0;
            border: 1px solid rgba(120, 120, 120, 0.5);
        }
        .btn-secondary:hover {
            background: rgba(150, 150, 150, 0.4);
            color: white;
            border-color: #999;
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <nav class="navbar">
        <div class="container">
            <div class="logo">霓虹资源站</div>
            <a href="/" class="back-link">
                <i class="fas fa-arrow-left"></i>
                返回首页
            </a>
        </div>
    </nav>
    <div class="container">
        <div class="profile-card">
            <div class="profile-header">
                <div class="user-info">
                    <div style="display: flex; align-items: center; gap: 16px;">
                        <h1 id="nickname" style="margin: 0; font-size: 1.8rem;">用户名</h1>
                    </div>
                    <p>普通会员 · 欢迎回来</p>
                </div>
            </div>

            <div class="info-section">
                <h2>基本信息</h2>
                <div class="info-item">
                    <div class="info-label">用户名：</div>
                    <div class="info-value" id="infoUserName"></div>
                </div>
                <div class="info-item">
                    <div class="info-label">昵称：</div>
                    <div class="info-value" id="infoNickname"></div>
                </div>
                <div class="info-item">
                    <div class="info-label">邮箱：</div>
                    <div class="info-value" id="userEmail">未设置</div>
                </div>
                <div class="info-item">
                    <div class="info-label">电话：</div>
                    <div class="info-value" id="userPhone">未绑定</div>
                </div>
                <div class="info-item">
                    <div class="info-label">注册时间：</div>
                    <div class="info-value" id="registerTime">2026-02-25</div>
                </div>
                <div class="info-item">
                    <div class="info-label">积分：</div>
                    <div class="info-value" id="userPoints">1280</div>
                </div>
                <div class="info-item">
                    <div class="info-label">我的邀请码：</div>
                    <div class="info-value" id="infoInviteCode" style="color: #5ba5ff; font-weight: bold;"></div>
                </div>
                <div class="info-item">
                    <div class="info-label">会员状态：</div>
                    <div class="info-value" id="infoMemberStatus">非会员</div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-secondary" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                    退出登录
                </button>
            </div>
        </div>
    </div>

<script>
    // 从 localStorage 获取用户信息
    let username = null;
    let userData = null;
    const userInfo = localStorage.getItem('userInfo');
    if (!userInfo) {
        // 如果没登录，直接跳回首页
        window.location.href = '/';
    } else {
        try {
            userData = JSON.parse(userInfo);
            username = userData.username;
            document.getElementById('nickname').innerText = username;
            document.getElementById('infoUserName').innerText = username;
            document.getElementById('infoNickname').innerText = username;

            // 显示邀请码
            if (userData.inviteCode) {
                document.getElementById('infoInviteCode').innerText = userData.inviteCode;
            } else {
                document.getElementById('infoInviteCode').innerText = '暂无';
            }

            // 显示会员状态（个人中心显示会员类型 + 到期时间）
            let memberStatusDisplay = '';
            if (userData.memberStatus === 'permanent') {
                memberStatusDisplay = '永久会员';
                document.getElementById('infoMemberStatus').style.color = '#FFD700';
            } else if (userData.memberStatus === 'active') {
                let memberTypeName = '会员';
                if (userData.memberType === 1) memberTypeName = '月度会员';
                else if (userData.memberType === 2) memberTypeName = '季度会员';
                else if (userData.memberType === 3) memberTypeName = '年度会员';
                memberStatusDisplay = memberTypeName + ' · ' + (userData.memberExpireText || '未知');
                document.getElementById('infoMemberStatus').style.color = '#70ffb0';
            } else if (userData.memberStatus === 'expired') {
                memberStatusDisplay = '已到期';
                document.getElementById('infoMemberStatus').style.color = '#ff8a8a';
            } else {
                memberStatusDisplay = '非会员';
                document.getElementById('infoMemberStatus').style.color = '#90b0d1';
            }
            document.getElementById('infoMemberStatus').innerText = memberStatusDisplay;
        } catch (e) {
            console.error('解析用户信息失败:', e);
            window.location.href = '/';
        }
    }

    // 退出登录
    document.getElementById('logoutBtn').addEventListener('click', function() {
        localStorage.removeItem('userInfo');
        window.location.href = '/';
    });
</script>

<!-- 悬浮联系按钮组 -->
<div class="float-contact">
    <div class="contact-btn" id="wechatBtn">
        <i class="fa-brands fa-weixin"></i>
        <div class="contact-popup wechat-popup">
            <img src="/uploads/wechat_qr.png" alt="微信二维码">
            <p>扫码添加微信</p>
        </div>
    </div>
    <div class="contact-btn" id="qqBtn">
        <i class="fa-brands fa-qq"></i>
        <div class="contact-popup qq-popup">
            <img src="/uploads/qq_qr.png" alt="QQ二维码">
            <p>扫码添加QQ</p>
        </div>
    </div>
    <div class="contact-btn" id="emailBtn">
        <i class="fa-solid fa-envelope"></i>
        <div class="contact-popup email-popup">
            <p>邮箱地址</p>
            <p class="email-text">997973220@qq.com</p>
        </div>
    </div>
    <div class="contact-btn" id="officialAccountBtn">
        <i class="fa-solid fa-square-rss"></i>
        <div class="contact-popup official-popup">
            <img src="/uploads/official_qr.png" alt="公众号二维码">
            <p>扫码关注公众号</p>
        </div>
    </div>
    <div class="contact-btn" id="douyinBtn">
        <i class="fa-brands fa-tiktok"></i>
        <div class="contact-popup douyin-popup">
            <img src="/uploads/douyin_qr.png" alt="抖音二维码">
            <p>扫码关注抖音</p>
        </div>
    </div>
</div>
</body>
</html>
