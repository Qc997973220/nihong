<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源审核 · NEON 霓虹之都</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            background: #0b0e14;
            color: #eef3fc;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                    linear-gradient(rgba(120, 180, 255, 0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(120, 180, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 1;
        }
        .float-contact {
            position: fixed;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 999;
        }
        .contact-btn {
            position: relative;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(90, 170, 255, 0.5);
            background: rgba(15, 30, 55, 0.8);
            backdrop-filter: blur(16px);
            box-shadow: 0 0 25px rgba(30, 136, 229, 0.3), 0 4px 12px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }
        .contact-btn i { font-size: 1.5rem; }
        .contact-btn:nth-child(1) { color: #07c160; }
        .contact-btn:nth-child(2) { color: #12b7f5; }
        .contact-btn:nth-child(3) { color: #ff6b6b; }
        .contact-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 0 35px rgba(30, 136, 229, 0.5), 0 6px 15px rgba(0, 0, 0, 0.5);
            border-color: #5a9eff;
        }
        .contact-popup {
            position: absolute;
            right: 70px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 30, 55, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(90, 170, 255, 0.4);
            border-radius: 16px;
            padding: 16px;
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .contact-btn:hover .contact-popup {
            opacity: 1;
            visibility: visible;
            right: 65px;
        }
        .contact-popup img {
            width: 160px;
            height: 160px;
            border-radius: 12px;
            display: block;
            margin: 0 auto 12px;
            border: 2px solid rgba(90, 170, 255, 0.3);
        }
        .contact-popup p {
            text-align: center;
            color: #a0bedd;
            margin: 0;
            font-size: 0.9rem;
        }
        .contact-popup .email-text {
            color: #5a9eff;
            font-size: 1rem;
            font-weight: 500;
            margin-top: 8px;
            font-family: 'Courier New', monospace;
        }
        .navbar {
            background: rgba(10, 17, 28, 0.6);
            backdrop-filter: blur(20px) saturate(200%);
            border-bottom: 1px solid rgba(90, 160, 255, 0.2);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 450;
            background: linear-gradient(135deg, #e0efff, #b2d9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
            filter: drop-shadow(0 0 8px #3f8eff);
            white-space: nowrap;
        }
        .back-link {
            color: #5ba5ff;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s, text-shadow 0.2s;
        }
        .back-link:hover {
            color: white;
            text-shadow: 0 0 8px #4d9eff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
            width: 100%;
            flex: 1;
            position: relative;
            z-index: 10;
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .page-header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #e0efff, #b2d9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px #3f8eff);
        }
        .pending-badge {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid rgba(255, 71, 87, 0.5);
            color: #ff8a8a;
            padding: 6px 16px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .refresh-btn {
            padding: 10px 20px;
            background: rgba(91, 165, 255, 0.2);
            border: 1px solid rgba(91, 165, 255, 0.5);
            border-radius: 60px;
            color: #5ba5ff;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .refresh-btn:hover {
            background: rgba(91, 165, 255, 0.3);
            border-color: #5ba5ff;
            box-shadow: 0 0 15px rgba(91, 165, 255, 0.5);
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: rgba(20, 30, 50, 0.5);
            border-radius: 24px;
            border: 1px solid rgba(90, 160, 255, 0.2);
        }
        .empty-state i {
            font-size: 4rem;
            color: #5ba5ff;
            margin-bottom: 20px;
        }
        .empty-state h2 {
            color: #b8dcff;
            margin-bottom: 10px;
        }
        .empty-state p {
            color: #90b0d1;
        }
        .resource-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .resource-card {
            background: rgba(20, 30, 50, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(90, 160, 255, 0.2);
            transition: all 0.3s;
        }
        .resource-card:hover {
            border-color: rgba(90, 160, 255, 0.4);
            box-shadow: 0 0 20px rgba(90, 160, 255, 0.2);
        }
        .resource-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .resource-title {
            font-size: 1.3rem;
            color: #ffffff;
            font-weight: 600;
        }
        .resource-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .meta-tag {
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .meta-tag.category {
            background: rgba(91, 165, 255, 0.2);
            color: #5ba5ff;
        }
        .meta-tag.author {
            background: rgba(150, 100, 255, 0.2);
            color: #c4a0ff;
        }
        .meta-tag.time {
            background: rgba(90, 160, 255, 0.1);
            color: #90b0d1;
        }
        .resource-summary {
            color: #b0c8e0;
            margin-bottom: 16px;
            line-height: 1.6;
        }
        .resource-content {
            background: rgba(10, 18, 32, 0.5);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            color: #a0b8d0;
            line-height: 1.7;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .resource-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 550;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-approve {
            background: linear-gradient(105deg, #1a8a4a, #25b85a);
            color: white;
            box-shadow: 0 5px 15px -5px #0a5a2a, 0 0 0 1px rgba(0, 255, 150, 0.3) inset;
        }
        .btn-approve:hover {
            background: linear-gradient(105deg, #25b85a, #30d06a);
            box-shadow: 0 0 30px #00cc55;
            transform: scale(1.02);
        }
        .btn-reject {
            background: rgba(120, 120, 120, 0.3);
            color: #ffb0b0;
            border: 1px solid rgba(255, 100, 100, 0.5);
        }
        .btn-reject:hover {
            background: rgba(255, 100, 100, 0.3);
            border-color: #ff6666;
            color: white;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 500;
            z-index: 1000;
            transition: transform 0.3s;
            backdrop-filter: blur(10px);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: rgba(0, 200, 150, 0.2);
            color: #b0ffde;
            border: 1px solid rgba(0, 255, 200, 0.4);
        }
        .toast.error {
            background: rgba(255, 80, 80, 0.2);
            color: #ffb0b0;
            border: 1px solid rgba(255, 100, 100, 0.5);
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
        }
        .loading i {
            font-size: 2rem;
            color: #5ba5ff;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 768px) {
            .container {
                padding: 24px 16px;
            }
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .resource-header {
                flex-direction: column;
            }
            .resource-actions {
                justify-content: stretch;
            }
            .resource-actions .btn {
                flex: 1;
            }
        }
        .tab-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(90, 160, 255, 0.2);
            padding-bottom: 12px;
        }
        .tab-btn {
            padding: 12px 24px;
            background: rgba(20, 30, 50, 0.5);
            border: 1px solid rgba(90, 160, 255, 0.3);
            border-radius: 12px;
            color: #90b0d1;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn:hover {
            background: rgba(91, 165, 255, 0.2);
            color: #b8dcff;
        }
        .tab-btn.active {
            background: rgba(91, 165, 255, 0.3);
            border-color: rgba(91, 165, 255, 0.6);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(91, 165, 255, 0.3);
        }
        .cardkey-panel {
            background: rgba(20, 30, 50, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(90, 160, 255, 0.2);
        }
        .cardkey-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .cardkey-stats {
            display: flex;
            gap: 32px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .stat-label {
            font-size: 0.85rem;
            color: #90b0d1;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #5ba5ff;
            font-family: 'Orbitron', sans-serif;
        }
        .cardkey-actions {
            display: flex;
            gap: 12px;
        }
        .btn-generate {
            background: linear-gradient(105deg, #1a6a9a, #2580c5);
            color: white;
            border: none;
        }
        .btn-generate:hover {
            background: linear-gradient(105deg, #2580c5, #3090e0);
            box-shadow: 0 0 25px rgba(37, 128, 197, 0.6);
            transform: scale(1.02);
        }
        .btn-refresh {
            padding: 10px 20px;
            background: rgba(91, 165, 255, 0.15);
            border: 1px solid rgba(91, 165, 255, 0.4);
            color: #5ba5ff;
        }
        .btn-refresh:hover {
            background: rgba(91, 165, 255, 0.25);
            border-color: #5ba5ff;
        }
        .generate-form {
            background: rgba(15, 25, 45, 0.6);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(90, 160, 255, 0.3);
        }
        .form-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .form-row label {
            color: #b0c8e0;
            font-weight: 500;
        }
        .form-row input {
            width: 100px;
            padding: 8px 12px;
            background: rgba(10, 18, 32, 0.8);
            border: 1px solid rgba(90, 160, 255, 0.4);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
        }
        .form-row input:focus {
            outline: none;
            border-color: #5ba5ff;
            box-shadow: 0 0 10px rgba(91, 165, 255, 0.3);
        }
        .btn-confirm {
            background: linear-gradient(105deg, #1a8a4a, #25b85a);
            color: white;
        }
        .btn-confirm:hover {
            box-shadow: 0 0 25px rgba(0, 200, 100, 0.5);
            transform: scale(1.02);
        }
        .btn-cancel {
            background: rgba(120, 120, 120, 0.2);
            color: #b0b0b0;
            border: 1px solid rgba(120, 120, 120, 0.4);
        }
        .btn-cancel:hover {
            background: rgba(255, 100, 100, 0.2);
            border-color: rgba(255, 100, 100, 0.5);
            color: #ffb0b0;
        }
        .btn-page {
            padding: 8px 16px;
            background: rgba(90, 160, 255, 0.15);
            color: #64b5f6;
            border: 1px solid rgba(90, 160, 255, 0.3);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn-page:hover:not(:disabled) {
            background: rgba(90, 160, 255, 0.25);
            border-color: rgba(90, 160, 255, 0.5);
        }
        .btn-page:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .cardkey-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .cardkey-card {
            background: rgba(15, 25, 45, 0.6);
            border: 1px solid rgba(90, 160, 255, 0.25);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.2s;
            position: relative;
        }
        .cardkey-card:hover {
            border-color: rgba(90, 160, 255, 0.5);
            box-shadow: 0 0 15px rgba(91, 165, 255, 0.15);
        }
        .cardkey-card.used {
            opacity: 0.6;
            border-color: rgba(150, 150, 150, 0.3);
        }
        .cardkey-delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 6px;
            background: rgba(255, 100, 100, 0.15);
            color: #ff6464;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .cardkey-delete-btn:hover {
            background: rgba(255, 100, 100, 0.3);
            color: #ff4444;
            transform: scale(1.1);
        }
        .cardkey-key {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            color: #5ba5ff;
            font-weight: 600;
            margin-bottom: 8px;
            word-break: break-all;
        }
        .cardkey-card.used .cardkey-key {
            color: #90b0d1;
            text-decoration: line-through;
        }
        .cardkey-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #90b0d1;
        }
        .cardkey-status {
            padding: 2px 10px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .cardkey-status.available {
            background: rgba(0, 200, 100, 0.2);
            color: #70ffb0;
        }
        .cardkey-status.used {
            background: rgba(150, 150, 150, 0.2);
            color: #a0a0a0;
        }
        .cardkey-status.pending {
            background: rgba(255, 193, 7, 0.18);
            color: #ffd36a;
        }
        .cardkey-status.paid,
        .cardkey-status.published {
            background: rgba(0, 200, 100, 0.2);
            color: #70ffb0;
        }
        .cardkey-status.rejected {
            background: rgba(255, 80, 80, 0.18);
            color: #ff9a9a;
        }
        .cardkey-type {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            background: rgba(100, 150, 255, 0.2);
            color: #90c0ff;
        }
        .withdrawal-tools {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .withdrawal-filter {
            padding: 8px 12px;
            border: 1px solid #3d5a80;
            border-radius: 4px;
            background: #1a1a2e;
            color: #e8e8e8;
        }
        .withdrawal-card {
            background: rgba(15, 25, 45, 0.6);
            border: 1px solid rgba(90, 160, 255, 0.25);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.2s;
        }
        .withdrawal-card:hover {
            border-color: rgba(90, 160, 255, 0.5);
            box-shadow: 0 0 15px rgba(91, 165, 255, 0.15);
        }
        .withdrawal-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }
        .withdrawal-title {
            color: #eef3fc;
            font-weight: 700;
            word-break: break-all;
        }
        .withdrawal-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            color: #90b0d1;
            font-size: 0.86rem;
            margin-top: 8px;
        }
        .withdrawal-amount {
            color: #70ffb0;
            font-weight: 700;
        }
        .withdrawal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .cardkey-used-by {
            font-size: 0.8rem;
            color: #b0c8e0;
            margin-top: 4px;
        }
        .cardkey-empty {
            text-align: center;
            padding: 40px;
            color: #90b0d1;
        }
        .generated-keys-box {
            background: rgba(10, 18, 32, 0.8);
            border: 1px solid rgba(0, 200, 100, 0.4);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .generated-keys-title {
            color: #70ffb0;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .generated-keys-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .generated-key-item {
            background: rgba(0, 150, 80, 0.2);
            border: 1px solid rgba(0, 200, 100, 0.3);
            border-radius: 8px;
            padding: 8px 14px;
            font-family: 'Orbitron', monospace;
            font-size: 0.95rem;
            color: #70ffb0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .generated-key-item:hover {
            background: rgba(0, 200, 100, 0.3);
            transform: scale(1.05);
        }
        .agent-tools {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .agent-tools input {
            padding: 8px 12px;
            border: 1px solid #3d5a80;
            border-radius: 4px;
            background: #1a1a2e;
            color: #e8e8e8;
        }
        .agent-form {
            background: rgba(15, 25, 45, 0.6);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 18px;
            border: 1px solid rgba(90, 160, 255, 0.3);
        }
        .agent-form .form-row {
            align-items: center;
        }
        .agent-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .agent-card {
            background: rgba(15, 25, 45, 0.6);
            border: 1px solid rgba(90, 160, 255, 0.25);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.2s;
        }
        .agent-card:hover {

    <div class="toast" id="toast"></div>

    <script>
        function getHost() {
            return '';
        }

        function getAuthToken() {
            return localStorage.getItem('authToken') || '';
        }

        function authHeaders(extraHeaders = {}) {
            const token = getAuthToken();
            const headers = { ...extraHeaders };
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            return headers;
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = isError ? 'toast error show' : 'toast success show';
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function formatDate(dateString) {
            if (!dateString) return '未知';
            const date = new Date(dateString);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function displayCategoryName(category) {
            const value = String(category || '').trim();
            if (value === '网创' || value === 'VIP专享') return 'VIP项目';
            if (value === '免费') return '免费项目';
            if (value === '娱乐资源' || value === '娱乐' || value === '软件' || value === '游戏' || value === '资讯') return '免费资源';
            return value;
        }

        function checkAdmin() {
            const userInfo = localStorage.getItem('userInfo');
            if (!userInfo || !getAuthToken()) {
                showToast('请先登录', true);
                setTimeout(() => window.location.href = '/', 1500);
                return null;
            }
            try {
                const user = JSON.parse(userInfo);
                if (user.role !== '1') {
                    showToast('您没有管理员权限', true);
                    setTimeout(() => window.location.href = '/', 1500);
                    return null;
                }
                return user;
            } catch (e) {
                showToast('登录信息解析失败', true);
                setTimeout(() => window.location.href = '/', 1500);
                return null;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function loadPendingResources() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p style="margin-top: 12px; color: #90b0d1;">加载中...</p>
                </div>
            `;

            fetch(`/api/resources/pending`, {
                headers: authHeaders()
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        renderResources(data.resources || []);
                        document.getElementById('pendingCount').textContent =
                            (data.resources || []).length + ' 条待审核';
                    } else {
                        showToast(data.message || '加载失败', true);
                    }
                })
                .catch(error => {
                    console.error('加载待审核资源失败:', error);
                    showToast('网络错误', true);
                });
        }

        function renderResources(resources) {
            const contentArea = document.getElementById('contentArea');

            if (resources.length === 0) {

        function approveResource(id) {
            const card = document.getElementById(`resource-${id}`);
            const btns = card.querySelectorAll('.btn');
            btns.forEach(btn => btn.disabled = true);

            fetch(`/api/resources/audit`, {
                method: 'POST',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ id: id, status: 1 })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast('资源已通过审核');
                    card.style.opacity = '0.5';
                    card.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        loadPendingResources();
                    }, 500);
                } else {
                    showToast(data.message || '操作失败', true);
                    btns.forEach(btn => btn.disabled = false);
                }
            })
            .catch(error => {
                console.error('审核失败:', error);
                showToast('网络错误', true);
                btns.forEach(btn => btn.disabled = false);
            });
        }

                    showToast('资源已拒绝');
                    card.style.opacity = '0.5';
                    card.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        loadPendingResources();

                    showToast(data.message || '操作失败', true);
                    btns.forEach(btn => btn.disabled = false);

        function getGrantMemberTypeName(type) {
            switch (Number(type)) {
                case 3: return '年费会员';
                case 4: return '永久会员';
                case 5: return '霓虹代理';
                default: return '普通用户';
            }
        }

        function getMemberBadgeStyle(type) {
            if (Number(type) === 5) {
                return 'color:#ff5f6d;border-color:rgba(255,95,109,0.45);background:rgba(255,95,109,0.14);';
            }
            if (Number(type) === 4) {
                return 'color:#ffd700;border-color:rgba(255,215,0,0.45);background:rgba(255,215,0,0.14);';
            }
            if (Number(type) === 3) {
                return 'color:#70ffb0;border-color:rgba(112,255,176,0.4);background:rgba(0,180,120,0.12);';
            }
            return '';
        }

        function readNonNegativeInt(id, fallback = 0) {
            const value = Number(document.getElementById(id).value);
            if (!Number.isFinite(value) || value < 0) return fallback;
            return Math.floor(value);
        }

        function createInviteData() {
            const account = (
                document.getElementById('inviteDataAccountInput').value.trim()
                || document.getElementById('grantAccountInput').value.trim()
            );
            if (!account) {
                showToast('请输入邀请人账号', true);
                return;
            }

            const payload = {
                account,
                permanentCount: readNonNegativeInt('invitePermanentCount'),
                yearlyCount: readNonNegativeInt('inviteYearlyCount'),
                regularCount: readNonNegativeInt('inviteRegularCount'),
                permanentRewardAmount: readNonNegativeInt('invitePermanentReward', 100),
                yearlyRewardAmount: readNonNegativeInt('inviteYearlyReward', 69)
            };

            const totalCount = payload.permanentCount + payload.yearlyCount + payload.regularCount;
            if (totalCount <= 0) {
                showToast('至少生成1个邀请用户', true);
                return;
            }
            if (!confirm(`确认给账号 ${account} 生成 ${totalCount} 个邀请用户，并增加 ${payload.permanentCount * payload.permanentRewardAmount + payload.yearlyCount * payload.yearlyRewardAmount} N币奖励吗？`)) {
                return;
            }

            const btn = document.getElementById('createInviteDataBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 生成中...';

            fetch('/api/admin/users/invite-data', {
                method: 'POST',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast(data.message || '邀请数据已生成');
                    renderInviteDataResult(data);
                    searchAdminUsers();
                } else {
                    showToast(data.message || '邀请数据生成失败', true);
                }
            })
            .catch(error => {
                console.error('邀请数据生成失败:', error);
                showToast('网络错误', true);
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> 生成邀请数据';
            });
        }

        function renderInviteDataResult(data) {
            const resultArea = document.getElementById('inviteDataResultArea');
            const users = Array.isArray(data.generatedUsers) ? data.generatedUsers : [];
            const preview = users.slice(0, 12).map(user => {
                const reward = Number(user.rewardAmount || 0);
                return `

                        <div class="cardkey-key" style="font-size: 0.95rem;">${escapeHtml(user.userName || user.account || '--')}</div>
                        <div class="cardkey-meta">
                            <span>${escapeHtml(user.account || '--')}</span>
                            <span>${escapeHtml(user.memberTypeName || '普通用户')}</span>
                            <span>${reward > 0 ? '+' + reward + ' N币' : '未奖励'}</span>
                        </div>
                    </div>
                `;
            }).join('');

            resultArea.innerHTML = `
                <div class="cardkey-empty" style="text-align: left; padding: 16px;">
                    <p>已给 ${escapeHtml(data.inviterAccount || '')} 生成 ${Number(data.createdCount || 0)} 个邀请用户，新增奖励 ${Number(data.addedRewardTotal || 0)} N币，当前余额 ${Number(data.nCoinBalance || 0)} N币。</p>
                    ${users.length > 0 ? `<div class="cardkey-list" style="margin-top: 12px;">${preview}</div>` : ''}
                    ${users.length > 12 ? `<p style="margin-top: 10px; color: #90b0d1;">仅展示前12条，完整数据已写入数据库。</p>` : ''}

        function loadResourceList(page = 1) {
            const listArea = document.getElementById('resourceListArea');
            listArea.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><p style="margin-top: 12px; color: #90b0d1;">加载中...</p></div>';

            const keyword = document.getElementById('resourceSearchInput').value;
            const statusFilter = document.getElementById('resourceStatusFilter').value;

            let url = `/api/resources/all?page=${page}&pageSize=10`;
            if (keyword) {
                url += `&keyword=${encodeURIComponent(keyword)}`;
            }

            fetch(url, {
                headers: authHeaders()
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        let resources = data.resources || [];
                        
                        if (statusFilter !== 'all') {
                            resources = resources.filter(r => r.status === parseInt(statusFilter));
                        }
                        
                        updateResourceStats(data);
                        renderResourceList(resources);
                        updateResourcePagination(data);
                    } else {
                        showToast('加载资源列表失败', true);
                    }
                })
                .catch(error => {
                    console.error('加载资源列表失败:', error);
                    showToast('网络错误', true);
                });
        }

        function updateResourceStats(data) {
            document.getElementById('resourceTotalCount').textContent = data.totalElements || 0;
            document.getElementById('resourcePublishedCount').textContent = (data.resources || []).filter(r => r.status === 1 || r.status === 2).length;
            document.getElementById('resourcePendingCount').textContent = (data.resources || []).filter(r => r.status === 0).length;
        }

        function updateResourcePagination(data) {
            const paginationArea = document.getElementById('resourcePaginationArea');
            const pageInfo = document.getElementById('resourcePageInfo');
            const prevBtn = document.getElementById('resourcePrevPageBtn');
            const nextBtn = document.getElementById('resourceNextPageBtn');

            if (data.totalPages > 1) {
                paginationArea.style.display = 'flex';
                pageInfo.textContent = `第 ${data.currentPage} / ${data.totalPages} 页，共 ${data.totalElements} 条`;
                prevBtn.disabled = !data.hasPrevious;
                nextBtn.disabled = !data.hasNext;
            } else if (data.totalElements > 0) {
                paginationArea.style.display = 'flex';
                pageInfo.textContent = `共 ${data.totalElements} 条`;
                prevBtn.disabled = true;
                nextBtn.disabled = true;
            } else {
                paginationArea.style.display = 'none';
            }
        }

        function resourcePrevPage() {
            const pageInfo = document.getElementById('resourcePageInfo').textContent;
            const match = pageInfo.match(/第 (\d+) /);
            if (match) {
                const currentPage = parseInt(match[1]);
                if (currentPage > 1) {
                    loadResourceList(currentPage - 1);
                }
            }
        }

        function resourceNextPage() {
            const pageInfo = document.getElementById('resourcePageInfo').textContent;
            const match = pageInfo.match(/第 (\d+) \/ \d+ 页/);
            if (match) {
                const currentPage = parseInt(match[1]);
                const totalPagesMatch = pageInfo.match(/\/ (\d+) 页/);
                if (totalPagesMatch) {
                    const totalPages = parseInt(totalPagesMatch[1]);
                    if (currentPage < totalPages) {
                        loadResourceList(currentPage + 1);
                    }
                }
            }
        }

        function renderResourceList(resources) {
            const listArea = document.getElementById('resourceListArea');

            if (resources.length === 0) {
                listArea.innerHTML = '<div class="cardkey-empty"><i class="fas fa-folder-open" style="font-size: 2rem; margin-bottom: 12px;"></i><p>暂无资源记录</p></div>';
                return;
            }

            let html = '<div class="cardkey-list">';
            resources.forEach(resource => {
                const statusClass = (resource.status === 1 || resource.status === 2) ? 'published' : (resource.status === 0 ? 'pending' : 'rejected');
                const statusText = resource.status === 1 ? '已发布' : (resource.status === 2 ? '推荐/公开' : (resource.status === 0 ? '待审核' : '已拒绝'));
                html += `
                    <div class="cardkey-card">
                        <div class="cardkey-key" style="font-size: 0.95rem;">${resource.title}</div>
                        <div class="cardkey-meta">
                            <span class="cardkey-type">${displayCategoryName(resource.category || '未分类')}</span>
                            <span class="cardkey-status ${statusClass}">${statusText}</span>
                            <span>${formatDate(resource.createdAt)}</span>
                        </div>
                        ${resource.summary ? '<div style="color: #90b0d1; font-size: 0.8rem; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + resource.summary + '</div>' : ''}
                        <button class="cardkey-delete-btn" onclick="openResourceEditModal(${resource.id})" title="编辑资源" style="background: rgba(100, 180, 255, 0.15); color: #64b5f6; right: 36px;">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="cardkey-delete-btn" onclick="deleteResource(${resource.id})" title="删除资源">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
            });
            html += '</div>';
            listArea.innerHTML = html;
        }

                        document.getElementById('editResourceContent').value = resource.content || '';

        function saveResourceEdit() {
            const id = document.getElementById('editResourceId').value;
            if (!id) {
                showToast('资源ID不能为空', true);
                return;
            }

            const resource = {
                id: parseInt(id),
                title: document.getElementById('editResourceTitle').value,
                category: document.getElementById('editResourceCategory').value,
                summary: document.getElementById('editResourceSummary').value,
                image: document.getElementById('editResourceImage').value,
                downloadLink: document.getElementById('editResourceDownloadLink').value,
                downloadPassword: document.getElementById('editResourceDownloadPassword').value,
                status: parseInt(document.getElementById('editResourceStatus').value),
                content: document.getElementById('editResourceContent').value
            };

            fetch('/api/resources/update', {
                method: 'POST',
                headers: authHeaders({
                    'Content-Type': 'application/json'
                }),
                body: JSON.stringify(resource)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast('资源更新成功');
                    closeResourceEditModal();
                    loadResourceList();
                } else {
                    showToast('更新失败: ' + data.message, true);
                }
            })
            .catch(error => {
                console.error('更新资源失败:', error);
                showToast('网络错误', true);
            });
        }

        function deleteResource(id) {
            if (!confirm('确定要删除这条资源吗？')) {
                return;
            }

            fetch(`/api/resources/delete/${id}`, {
                method: 'DELETE',
                headers: authHeaders()
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast('删除成功');
                    loadResourceList();
                } else {
                    showToast('删除失败: ' + data.message, true);
                }
            })
            .catch(error => {
                console.error('删除资源失败:', error);
                showToast('网络错误', true);
            });
        }

        document.getElementById('refreshResourceBtn').addEventListener('click', () => loadResourceList(1));
        document.getElementById('resourceStatusFilter').addEventListener('change', () => loadResourceList(1));
        document.getElementById('resourceSearchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadResourceList(1);
            }
        });

        function loadCardKeyList() {
            const listArea = document.getElementById('cardKeyListArea');
            listArea.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><p style="margin-top: 12px; color: #90b0d1;">加载中...</p></div>';

            const memberType = document.getElementById('memberTypeFilter').value;
            const url = memberType && memberType != '0' 
                ? `/api/cardkey/list?memberType=${memberType}` 
                : '/api/cardkey/list';

            fetch(url, {
                headers: authHeaders()
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        updateCardKeyStats(data.data || []);
                        renderCardKeyList(data.data || []);
                    } else {
                        showToast('加载卡密列表失败', true);
                    }
                })
                .catch(error => {
                    console.error('加载卡密列表失败:', error);
                    showToast('网络错误', true);
                });
        }

        function updateCardKeyStats(cardKeys) {
            const total = cardKeys.length;
            const used = cardKeys.filter(k => k.status === 1).length;
            const available = total - used;

            document.getElementById('availableCount').textContent = available;
            document.getElementById('usedCount').textContent = used;
            document.getElementById('totalCount').textContent = total;
        }

        function renderCardKeyList(cardKeys) {
            const listArea = document.getElementById('cardKeyListArea');

            if (cardKeys.length === 0) {
                listArea.innerHTML = '<div class="cardkey-empty"><i class="fas fa-key" style="font-size: 2rem; margin-bottom: 12px;"></i><p>暂无卡密记录</p></div>';
                return;
            }

            let html = '<div class="cardkey-list">';
            cardKeys.forEach(key => {
                const isUsed = key.status === 1;
                const memberTypeName = key.memberTypeName || getMemberTypeName(key.memberType);
                html += `
                    <div class="cardkey-card ${isUsed ? 'used' : ''}">
                        <div class="cardkey-key">${key.cardKey}</div>
                        <div class="cardkey-meta">
                            <span class="cardkey-type">${memberTypeName}</span>
                            <span class="cardkey-status ${isUsed ? 'used' : 'available'}">
                                ${isUsed ? '已使用' : '可用'}
                            </span>
                            <span>${formatDate(key.createdAt)}</span>
                        </div>
                        ${isUsed && key.usedBy ? '<div class="cardkey-used-by">使用者: ' + key.usedBy + '</div>' : ''}
                        <button class="cardkey-delete-btn" onclick="deleteCardKey(${key.id})" title="删除卡密">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
            });
            html += '</div>';
            listArea.innerHTML = html;
        }

        function getMemberTypeName(type) {
            switch (type) {
                case 3: return '年费会员(360天)';
                case 4: return '永久会员';
                case 5: return '霓虹代理';
                default: return '未知';
            }
        }

        function generateCardKeys() {
            const count = parseInt(document.getElementById('generateCount').value);
            const memberType = parseInt(document.getElementById('memberType').value);

            if (isNaN(count) || count < 1 || count > 100) {
                showToast('生成数量必须在1-100之间', true);
                return;
            }

            const confirmBtn = document.getElementById('confirmGenerateBtn');
            confirmBtn.disabled = true;
            confirmBtn.innerHTML = '<i class="fas fa-spinner"></i> 生成中...';

            fetch('/api/cardkey/generate?count=' + count + '&memberType=' + memberType, {
                method: 'POST',
                headers: authHeaders()
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast(data.message || '成功生成 ' + data.count + ' 个卡密');
                    document.getElementById('generateForm').style.display = 'none';
                    showGeneratedKeys(data.keys, data.memberTypeName);
                    loadCardKeyList();
                } else {
                    showToast(data.message || '生成失败', true);
                }
            })
            .catch(error => {
                console.error('生成卡密失败:', error);
                showToast('网络错误', true);
            })
            .finally(() => {
                confirmBtn.disabled = false;
                confirmBtn.innerHTML = '<i class="fas fa-check"></i> 确认生成';
            });
        }

        let currentWithdrawalPage = 1;
        let currentWithdrawalTotalPages = 1;

        function loadAdminWithdrawals(page = 1, silent = false) {
            const listArea = document.getElementById('withdrawalListArea');
            const status = document.getElementById('withdrawStatusFilter').value;
            currentWithdrawalPage = page;

            if (!silent && listArea) {
                listArea.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><p style="margin-top: 12px; color: #90b0d1;">加载中...</p></div>';
            }

            const url = `/api/wallet/admin/withdrawals?page=${page}&pageSize=10&status=${encodeURIComponent(status)}`;
            fetch(url, {
                headers: authHeaders()
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    updateWithdrawalStats(data);
                    if (!silent) {
                        renderWithdrawalList(data.withdrawals || []);
                        updateWithdrawalPagination(data);
                    }
                } else {
                    if (!silent) {
                        showToast(data.message || '加载提现列表失败', true);
                        listArea.innerHTML = '<div class="cardkey-empty"><i class="fas fa-wallet" style="font-size: 2rem; margin-bottom: 12px;"></i><p>加载失败</p></div>';
                    }
                }
            })
            .catch(error => {
                console.error('加载提现列表失败:', error);
                if (!silent) {
                    showToast('网络错误', true);
                    listArea.innerHTML = '<div class="cardkey-empty"><i class="fas fa-wallet" style="font-size: 2rem; margin-bottom: 12px;"></i><p>网络错误</p></div>';
                }
            });
        }

        function loadAgentList(silent = false) {
            const listArea = document.getElementById('agentListArea');
            if (!silent && listArea) {
                listArea.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><p style="margin-top: 12px; color: #90b0d1;">加载中...</p></div>';
            }

            const keyword = document.getElementById('agentSearchInput').value.trim();
            const url = `/api/agent/wechat/admin/list${keyword ? `?keyword=${encodeURIComponent(keyword)}` : ''}`;
            fetch(url, {
                headers: authHeaders()
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    updateAgentStats(data.agents || []);
                    if (!silent) {
                        renderAgentList(data.agents || []);
                    }
                } else if (!silent) {
                    showToast(data.message || '加载代理列表失败', true);
                    listArea.innerHTML = '<div class="cardkey-empty"><i class="fas fa-shield-halved" style="font-size: 2rem; margin-bottom: 12px;"></i><p>加载失败</p></div>';
                }
            })
            .catch(error => {
                console.error('加载代理列表失败:', error);
                if (!silent) {
                    showToast('网络错误', true);
                    listArea.innerHTML = '<div class="cardkey-empty"><i class="fas fa-shield-halved" style="font-size: 2rem; margin-bottom: 12px;"></i><p>网络错误</p></div>';
                }
            });
        }

        function updateAgentStats(agents) {
            const totalCountEl = document.getElementById('agentTotalCount');
            const activeCountEl = document.getElementById('agentActiveCount');
            const disabledCountEl = document.getElementById('agentDisabledCount');
            const total = agents.length;
            const active = agents.filter(item => Number(item.status) === 1).length;
            const disabled = agents.filter(item => Number(item.status) === 0).length;
            if (totalCountEl) totalCountEl.textContent = total;
            if (activeCountEl) activeCountEl.textContent = active;
            if (disabledCountEl) disabledCountEl.textContent = disabled;
        }

        function renderAgentList(agents) {
            const listArea = document.getElementById('agentListArea');
            if (!agents || agents.length === 0) {
                listArea.innerHTML = '<div class="cardkey-empty"><i class="fas fa-shield-halved" style="font-size: 2rem; margin-bottom: 12px;"></i><p>暂无代理商微信号记录</p></div>';
                return;
            }

            let html = '<div class="agent-list">';
            agents.forEach(agent => {
                const isActive = Number(agent.status) === 1;
                html += `
                    <div class="agent-card" id="agent-${agent.id}">
                        <div class="agent-wechat">${escapeHtml(agent.wechatId || '--')}</div>
                        <div class="agent-meta">
                            <span class="agent-status ${isActive ? 'active' : 'disabled'}">${isActive ? '启用中' : '已禁用'}</span>
                            <span>备注：${escapeHtml(agent.remark || '无')}</span>
                            <span>创建人：${escapeHtml(agent.createdBy || '--')}</span>
                            <span>更新时间：${formatDate(agent.updatedAt || agent.createdAt)}</span>
                        </div>
                        <div class="agent-note">保存后可在首页“代理商防伪”入口直接校验。</div>
                        <div class="agent-actions">
                            <button class="btn btn-confirm" onclick="toggleAgentStatus(${agent.id}, ${isActive ? 0 : 1})">
                                <i class="fas fa-${isActive ? 'ban' : 'check'}"></i> ${isActive ? '禁用' : '启用'}
                            </button>
                            <button class="btn btn-cancel" onclick="deleteAgent(${agent.id})">
                                <i class="fas fa-trash"></i> 删除
                            </button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            listArea.innerHTML = html;
        }

        function saveAgentWechat() {
            const wechatId = document.getElementById('agentWechatInputAdmin').value.trim();
            const remark = document.getElementById('agentRemarkInput').value.trim();
            if (!wechatId) {
                showToast('请输入代理商微信号', true);
                return;
            }

            const saveBtn = document.getElementById('saveAgentBtn');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 保存中...';

            fetch('/api/agent/wechat/admin/save', {
                method: 'POST',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ wechatId, remark })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast(data.message || '代理商微信号已保存');
                    document.getElementById('agentWechatInputAdmin').value = '';
                    document.getElementById('agentRemarkInput').value = '';
                    loadAgentList();
                } else {
                    showToast(data.message || '保存失败', true);
                }
            })
            .catch(error => {
                console.error('保存代理商微信号失败:', error);
                showToast('网络错误', true);
            })
            .finally(() => {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fas fa-plus"></i> 保存代理';
            });
        }

        function toggleAgentStatus(id, status) {
            fetch(`/api/agent/wechat/admin/${id}/status`, {
                method: 'POST',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ status })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast(data.message || '状态已更新');
                    loadAgentList();
                } else {
                    showToast(data.message || '状态更新失败', true);
                }
            })
            .catch(error => {
                console.error('代理状态更新失败:', error);
                showToast('网络错误', true);
            });
        }

        function deleteAgent(id) {
            if (!confirm('确定要删除这条代理商微信号记录吗？')) {
                return;
            }

            fetch(`/api/agent/wechat/admin/${id}`, {
                method: 'DELETE',
                headers: authHeaders()
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast(data.message || '删除成功');
                    loadAgentList();
                } else {
                    showToast(data.message || '删除失败', true);
                }
            })
            .catch(error => {
                console.error('删除代理记录失败:', error);
                showToast('网络错误', true);
            });
        }

        function updateWithdrawalStats(data) {
            const pending = data.pendingCount || 0;
            document.getElementById('withdrawPendingCount').textContent = pending;
            document.getElementById('withdrawPaidCount').textContent = data.paidCount || 0;
            document.getElementById('withdrawRejectedCount').textContent = data.rejectedCount || 0;
            document.getElementById('withdrawBadge').textContent = pending;
        }

        function renderWithdrawalList(withdrawals) {
            const listArea = document.getElementById('withdrawalListArea');
            if (!withdrawals || withdrawals.length === 0) {
                listArea.innerHTML = '<div class="cardkey-empty"><i class="fas fa-wallet" style="font-size: 2rem; margin-bottom: 12px;"></i><p>暂无提现申请</p></div>';
                return;
            }

            let html = '<div class="cardkey-list">';
            withdrawals.forEach(item => {
                const statusClass = getWithdrawalStatusClass(item.status);
                const isPending = item.status === 0;
                html += `
                    <div class="withdrawal-card" id="withdrawal-${item.id}">
                        <div class="withdrawal-head">
                            <div>
                                <div class="withdrawal-title">${escapeHtml(item.userName || item.account || '未知用户')}</div>
                                <div class="withdrawal-meta">
                                    <span>账号：${escapeHtml(item.account || '--')}</span>
                                    <span>支付宝：${escapeHtml(item.alipayAccount || '--')}</span>
                                </div>
                            </div>
                            <span class="cardkey-status ${statusClass}">${escapeHtml(item.statusText || '未知')}</span>
                        </div>
                        <div class="withdrawal-meta">
                            <span class="withdrawal-amount">${item.nCoinAmount || 0} N币 · ¥${item.cashAmount || '0.00'}</span>
                            <span>申请时间：${formatDate(item.createdAt || item.requestAt)}</span>
                            ${item.processedAt ? `<span>处理时间：${formatDate(item.processedAt)}</span>` : ''}
                            ${item.adminAccount ? `<span>处理人：${escapeHtml(item.adminAccount)}</span>` : ''}
                        </div>
                        ${item.remark ? `<div class="withdrawal-meta"><span>备注：${escapeHtml(item.remark)}</span></div>` : ''}
                        ${isPending ? `
                            <div class="withdrawal-actions">
                                <button class="btn btn-reject" onclick="rejectWithdrawal(${item.id})">
                                    <i class="fas fa-times"></i> 拒绝
                                </button>
                                <button class="btn btn-approve" onclick="approveWithdrawal(${item.id})">
                                    <i class="fas fa-check"></i> 标记已打款
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
            html += '</div>';
            listArea.innerHTML = html;
        }

        function getWithdrawalStatusClass(status) {
            if (status === 0) return 'pending';
            if (status === 1) return 'paid';
            if (status === 2) return 'rejected';
            return 'used';
        }

        function updateWithdrawalPagination(data) {
            currentWithdrawalTotalPages = data.totalPages || 1;
            const paginationArea = document.getElementById('withdrawalPaginationArea');
            const pageInfo = document.getElementById('withdrawalPageInfo');
            const prevBtn = document.getElementById('withdrawalPrevPageBtn');
            const nextBtn = document.getElementById('withdrawalNextPageBtn');

            if ((data.totalElements || 0) > 0) {
                paginationArea.style.display = 'flex';
                pageInfo.textContent = currentWithdrawalTotalPages > 1
                    ? `第 ${data.currentPage} / ${currentWithdrawalTotalPages} 页，共 ${data.totalElements} 条`
                    : `共 ${data.totalElements} 条`;
                prevBtn.disabled = !data.hasPrevious;
                nextBtn.disabled = !data.hasNext;
            } else {
                paginationArea.style.display = 'none';
            }
        }

        function withdrawalPrevPage() {
            if (currentWithdrawalPage > 1) {
                loadAdminWithdrawals(currentWithdrawalPage - 1);
            }
        }

        function withdrawalNextPage() {
            if (currentWithdrawalPage < currentWithdrawalTotalPages) {
                loadAdminWithdrawals(currentWithdrawalPage + 1);
            }
        }

        function approveWithdrawal(id) {
            if (!confirm('确认已完成支付宝打款，并标记该提现为已打款吗？')) {
                return;
            }

            fetch(`/api/wallet/admin/withdrawals/${id}/approve`, {
                method: 'POST',
                headers: authHeaders()
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast(data.message || '已标记为打款');
                    loadAdminWithdrawals(currentWithdrawalPage);
                } else {
                    showToast(data.message || '操作失败', true);
                }
            })
            .catch(error => {
                console.error('处理提现失败:', error);
                showToast('网络错误', true);
            });
        }

        function rejectWithdrawal(id) {
            const remark = prompt('请输入拒绝原因（可留空）：', '资料有误，请重新提交');
            if (remark === null) {
                return;
            }

            fetch(`/api/wallet/admin/withdrawals/${id}/reject`, {
                method: 'POST',
                headers: authHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ remark: remark })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast(data.message || '提现申请已拒绝');
                    loadAdminWithdrawals(currentWithdrawalPage);
                } else {
                    showToast(data.message || '操作失败', true);
                }
            })
            .catch(error => {
                console.error('拒绝提现失败:', error);
                showToast('网络错误', true);
            });
        }

        function showGeneratedKeys(keys, memberTypeName) {
            const listArea = document.getElementById('cardKeyListArea');
            let html = '<div class="generated-keys-box">';
            html += '<div class="generated-keys-title"><i class="fas fa-check-circle"></i> 成功生成以下 ' + (memberTypeName || '') + ' 卡密（点击复制）：</div>';
            html += '<div class="generated-keys-list">';
            keys.forEach(key => {
                html += '<div class="generated-key-item" onclick="copyToClipboard(\'' + key + '\')">' + key + '</div>';
            });
            html += '</div></div>';
            html += '<div id="cardKeyListAreaInner"></div>';
            listArea.innerHTML = html;
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(function() {
                showToast('已复制到剪贴板: ' + text);
            }, function() {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('已复制到剪贴板: ' + text);
            });
        }
    </script>
