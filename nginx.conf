server 
 { 
     listen 80;
    listen 443 ssl;
    http2 on; 
     server_name neonvip.cn xn--9iq928k1ug8jg.xn--fiqs8s; 
     index index.html index.htm default.htm default.html; 
     root /www/wwwroot/default/my-java-app; 
     include /www/server/panel/vhost/nginx/extension/neon-0/*.conf; 
     #CERT-APPLY-CHECK--START 
     include /www/server/panel/vhost/nginx/well-known/neon-0.conf; 
     #CERT-APPLY-CHECK--END 
 
     #SSL-START 
     #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/neon-0/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/neon-0/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;
 
     #SSL-END 
 
     #REWRITE-START 
     include /www/server/panel/vhost/rewrite/java_neon-0.conf; 
     #REWRITE-END 
 
     client_max_body_size 10M; 
 
     # 禁止访问的敏感文件 
     location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$ 
     { 
         return 404; 
     } 
 
     # 禁止访问的敏感目录 
     location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ { 
         return 404; 
     } 
 
     location /.well-known/ { 
         root /www/wwwroot/java_node_ssl; 
     } 
 
     #禁止在证书验证目录放入敏感文件 
     if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) { 
         return 403; 
     } 
 
     # ============================================== 
     # 【最高优先级】直接访问上传图片，绝对不进前端路由 
     # ============================================== 
     location ^~ /uploads/ { 
         root /www/wwwroot/default/my-java-app; 
         expires 30d; 
         access_log off; 
         add_header Cache-Control "public"; 
     } 
 
     # 静态资源缓存 
     location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|ttf|eot)$ { 
         root /www/wwwroot/default/my-java-app/static; 
         expires 30d; 
         add_header Cache-Control "public, immutable"; 
         access_log off; 
     } 
 
     # ==================== 修改这里 ==================== 
    # 后端接口 - 所有 /api/ 开头的请求都转发到 Java 服务
      location /api/ { 
         proxy_pass http://127.0.0.1:8060/;
         proxy_set_header Host $host; 
         proxy_set_header X-Real-IP $remote_addr; 
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
          proxy_set_header X-Forwarded-Proto $scheme; 
          proxy_connect_timeout 60s; 
          proxy_send_timeout 60s; 
          proxy_read_timeout 60s; 
          proxy_http_version 1.1; 
      }
     # ==================== 修改结束 ==================== 
 
     # 前端页面 
     location / { 
          root /www/wwwroot/default/my-java-app/static; 
          index index.html; 
          try_files $uri $uri/ /index.html; 
     } 
 
     # 安全头 
     add_header X-Frame-Options "SAMEORIGIN" always; 
     add_header X-Content-Type-Options "nosniff" always; 
     add_header X-XSS-Protection "1; mode=block" always; 
 
     access_log  /www/wwwlogs/neon-0.log; 
     error_log  /www/wwwlogs/neon-0.error.log; 
 } 