# 服务器配置优化 - 支持高并发
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=10000
server.tomcat.connection-timeout=20000

# 数据库连接池配置 - HikariCP优化
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA配置优化
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# 静态资源配置
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/,file:./avatars/,file:./uploads/

# 文件上传大小限制
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# 图片上传保存路径
app.upload.path=./uploads

# Redis 配置 - 改用宝塔的Redis，连接宿主机的 26739 端口
spring.data.redis.host=127.0.0.1
spring.data.redis.port=26739
spring.data.redis.password=beibei
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# Actuator 监控配置
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# QQ SMTP email verification
spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=${QQ_MAIL_USERNAME:2858861803@qq.com}
spring.mail.password=${QQ_MAIL_AUTH_CODE:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${spring.mail.username}
app.mail.from-name=Neon
