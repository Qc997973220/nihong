<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源审核 · NEON 霓虹之都</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            background: #0b0e14;
            color: #eef3fc;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                    linear-gradient(rgba(120, 180, 255, 0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(120, 180, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 1;
        }
        .float-contact {
            position: fixed;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 999;
        }
        .contact-btn {
            position: relative;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(90, 170, 255, 0.5);
            background: rgba(15, 30, 55, 0.8);
            backdrop-filter: blur(16px);
            box-shadow: 0 0 25px rgba(30, 136, 229, 0.3), 0 4px 12px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }
        .contact-btn i { font-size: 1.5rem; }
        .contact-btn:nth-child(1) { color: #07c160; }
        .contact-btn:nth-child(2) { color: #12b7f5; }
        .contact-btn:nth-child(3) { color: #ff6b6b; }
        .contact-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 0 35px rgba(30, 136, 229, 0.5), 0 6px 15px rgba(0, 0, 0, 0.5);
            border-color: #5a9eff;
        }
        .contact-popup {
            position: absolute;
            right: 70px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 30, 55, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(90, 170, 255, 0.4);
            border-radius: 16px;
            padding: 16px;
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .contact-btn:hover .contact-popup {
            opacity: 1;
            visibility: visible;
            right: 65px;
        }
        .contact-popup img {
            width: 160px;
            height: 160px;
            border-radius: 12px;
            display: block;
            margin: 0 auto 12px;
            border: 2px solid rgba(90, 170, 255, 0.3);
        }
        .contact-popup p {
            text-align: center;
            color: #a0bedd;
            margin: 0;
            font-size: 0.9rem;
        }
        .contact-popup .email-text {
            color: #5a9eff;
            font-size: 1rem;
            font-weight: 500;
            margin-top: 8px;
            font-family: 'Courier New', monospace;
        }
        .navbar {
            background: rgba(10, 17, 28, 0.6);
            backdrop-filter: blur(20px) saturate(200%);
            border-bottom: 1px solid rgba(90, 160, 255, 0.2);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 450;
            background: linear-gradient(135deg, #e0efff, #b2d9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
            filter: drop-shadow(0 0 8px #3f8eff);
            white-space: nowrap;
        }
        .back-link {
            color: #5ba5ff;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s, text-shadow 0.2s;
        }
        .back-link:hover {
            color: white;
            text-shadow: 0 0 8px #4d9eff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
            width: 100%;
            flex: 1;
            position: relative;
            z-index: 10;
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .page-header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #e0efff, #b2d9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px #3f8eff);
        }
        .pending-badge {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid rgba(255, 71, 87, 0.5);
            color: #ff8a8a;
            padding: 6px 16px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .refresh-btn {
            padding: 10px 20px;
            background: rgba(91, 165, 255, 0.2);
            border: 1px solid rgba(91, 165, 255, 0.5);
            border-radius: 60px;
            color: #5ba5ff;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .refresh-btn:hover {
            background: rgba(91, 165, 255, 0.3);
            border-color: #5ba5ff;
            box-shadow: 0 0 15px rgba(91, 165, 255, 0.5);
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: rgba(20, 30, 50, 0.5);
            border-radius: 24px;
            border: 1px solid rgba(90, 160, 255, 0.2);
        }
        .empty-state i {
            font-size: 4rem;
            color: #5ba5ff;
            margin-bottom: 20px;
        }
        .empty-state h2 {
            color: #b8dcff;
            margin-bottom: 10px;
        }
        .empty-state p {
            color: #90b0d1;
        }
        .resource-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .resource-card {
            background: rgba(20, 30, 50, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(90, 160, 255, 0.2);
            transition: all 0.3s;
        }
        .resource-card:hover {
            border-color: rgba(90, 160, 255, 0.4);
            box-shadow: 0 0 20px rgba(90, 160, 255, 0.2);
        }
        .resource-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .resource-title {
            font-size: 1.3rem;
            color: #ffffff;
            font-weight: 600;
        }
        .resource-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .meta-tag {
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .meta-tag.category {
            background: rgba(91, 165, 255, 0.2);
            color: #5ba5ff;
        }
        .meta-tag.author {
            background: rgba(150, 100, 255, 0.2);
            color: #c4a0ff;
        }
        .meta-tag.time {
            background: rgba(90, 160, 255, 0.1);
            color: #90b0d1;
        }
        .resource-summary {
            color: #b0c8e0;
            margin-bottom: 16px;
            line-height: 1.6;
        }
        .resource-content {
            background: rgba(10, 18, 32, 0.5);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            color: #a0b8d0;
            line-height: 1.7;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .resource-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 550;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-approve {
            background: linear-gradient(105deg, #1a8a4a, #25b85a);
            color: white;
            box-shadow: 0 5px 15px -5px #0a5a2a, 0 0 0 1px rgba(0, 255, 150, 0.3) inset;
        }
        .btn-approve:hover {
            background: linear-gradient(105deg, #25b85a, #30d06a);
            box-shadow: 0 0 30px #00cc55;
            transform: scale(1.02);
        }
        .btn-reject {
            background: rgba(120, 120, 120, 0.3);
            color: #ffb0b0;
            border: 1px solid rgba(255, 100, 100, 0.5);
        }
        .btn-reject:hover {
            background: rgba(255, 100, 100, 0.3);
            border-color: #ff6666;
            color: white;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 500;
            z-index: 1000;
            transition: transform 0.3s;
            backdrop-filter: blur(10px);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: rgba(0, 200, 150, 0.2);
            color: #b0ffde;
            border: 1px solid rgba(0, 255, 200, 0.4);
        }
        .toast.error {
            background: rgba(255, 80, 80, 0.2);
            color: #ffb0b0;
            border: 1px solid rgba(255, 100, 100, 0.5);
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
        }
        .loading i {
            font-size: 2rem;
            color: #5ba5ff;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 768px) {
            .container {
                padding: 24px 16px;
            }
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .resource-header {
                flex-direction: column;
            }
            .resource-actions {
                justify-content: stretch;
            }
            .resource-actions .btn {
                flex: 1;
            }
        }
        .tab-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(90, 160, 255, 0.2);
            padding-bottom: 12px;
        }
        .tab-btn {
            padding: 12px 24px;
            background: rgba(20, 30, 50, 0.5);
            border: 1px solid rgba(90, 160, 255, 0.3);
            border-radius: 12px;
            color: #90b0d1;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn:hover {
            background: rgba(91, 165, 255, 0.2);
            color: #b8dcff;
        }
        .tab-btn.active {
            background: rgba(91, 165, 255, 0.3);
            border-color: rgba(91, 165, 255, 0.6);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(91, 165, 255, 0.3);
        }
        .cardkey-panel {
            background: rgba(20, 30, 50, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(90, 160, 255, 0.2);
        }
        .cardkey-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .cardkey-stats {
            display: flex;
            gap: 32px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .stat-label {
            font-size: 0.85rem;
            color: #90b0d1;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #5ba5ff;
            font-family: 'Orbitron', sans-serif;
        }
        .cardkey-actions {
            display: flex;
            gap: 12px;
        }
        .btn-generate {
            background: linear-gradient(105deg, #1a6a9a, #2580c5);
            color: white;
            border: none;
        }
        .btn-generate:hover {
            background: linear-gradient(105deg, #2580c5, #3090e0);
            box-shadow: 0 0 25px rgba(37, 128, 197, 0.6);
            transform: scale(1.02);
        }
        .btn-refresh {
            padding: 10px 20px;
            background: rgba(91, 165, 255, 0.15);
            border: 1px solid rgba(91, 165, 255, 0.4);
            color: #5ba5ff;
        }
        .btn-refresh:hover {
            background: rgba(91, 165, 255, 0.25);
            border-color: #5ba5ff;
        }
        .generate-form {
            background: rgba(15, 25, 45, 0.6);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(90, 160, 255, 0.3);
        }
        .form-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .form-row label {
            color: #b0c8e0;
            font-weight: 500;
        }
        .form-row input {
            width: 100px;
            padding: 8px 12px;
            background: rgba(10, 18, 32, 0.8);
            border: 1px solid rgba(90, 160, 255, 0.4);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
        }
        .form-row input:focus {
            outline: none;
            border-color: #5ba5ff;
            box-shadow: 0 0 10px rgba(91, 165, 255, 0.3);
        }
        .btn-confirm {
            background: linear-gradient(105deg, #1a8a4a, #25b85a);
            color: white;
        }
        .btn-confirm:hover {
            box-shadow: 0 0 25px rgba(0, 200, 100, 0.5);
            transform: scale(1.02);
        }
        .btn-cancel {
            background: rgba(120, 120, 120, 0.2);
            color: #b0b0b0;
            border: 1px solid rgba(120, 120, 120, 0.4);
        }
        .btn-cancel:hover {
            background: rgba(255, 100, 100, 0.2);
            border-color: rgba(255, 100, 100, 0.5);
            color: #ffb0b0;
        }
        .cardkey-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .cardkey-card {
            background: rgba(15, 25, 45, 0.6);
            border: 1px solid rgba(90, 160, 255, 0.25);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.2s;
            position: relative;
        }
        .cardkey-card:hover {
            border-color: rgba(90, 160, 255, 0.5);
            box-shadow: 0 0 15px rgba(91, 165, 255, 0.15);
        }
        .cardkey-card.used {
            opacity: 0.6;
            border-color: rgba(150, 150, 150, 0.3);
        }
        .cardkey-delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 6px;
            background: rgba(255, 100, 100, 0.15);
            color: #ff6464;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .cardkey-delete-btn:hover {
            background: rgba(255, 100, 100, 0.3);
            color: #ff4444;
            transform: scale(1.1);
        }
        .cardkey-key {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            color: #5ba5ff;
            font-weight: 600;
            margin-bottom: 8px;
            word-break: break-all;
        }
        .cardkey-card.used .cardkey-key {
            color: #90b0d1;
            text-decoration: line-through;
        }
        .cardkey-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #90b0d1;
        }
        .cardkey-status {
            padding: 2px 10px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .cardkey-status.available {
            background: rgba(0, 200, 100, 0.2);
            color: #70ffb0;
        }
        .cardkey-status.used {
            background: rgba(150, 150, 150, 0.2);
            color: #a0a0a0;
        }
        .cardkey-type {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            background: rgba(100, 150, 255, 0.2);
            color: #90c0ff;
        }
        .cardkey-used-by {
            font-size: 0.8rem;
            color: #b0c8e0;
            margin-top: 4px;
        }
        .cardkey-empty {
            text-align: center;
            padding: 40px;
            color: #90b0d1;
        }
        .generated-keys-box {
            background: rgba(10, 18, 32, 0.8);
            border: 1px solid rgba(0, 200, 100, 0.4);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .generated-keys-title {
            color: #70ffb0;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .generated-keys-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .generated-key-item {
            background: rgba(0, 150, 80, 0.2);
            border: 1px solid rgba(0, 200, 100, 0.3);
            border-radius: 8px;
            padding: 8px 14px;
            font-family: 'Orbitron', monospace;
            font-size: 0.95rem;
            color: #70ffb0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .generated-key-item:hover {
            background: rgba(0, 200, 100, 0.3);
            transform: scale(1.05);
        }
        @media (max-width: 768px) {
            .cardkey-stats {
                flex-wrap: wrap;
                gap: 20px;
            }
            .cardkey-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .cardkey-actions {
                width: 100%;
            }
            .cardkey-actions .btn {
                flex: 1;
            }
            .tab-nav {
                flex-wrap: wrap;
            }
            .tab-btn {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <nav class="navbar">
        <div class="container">
            <div class="logo">霓虹资源站</div>
            <a href="/" class="back-link">
                <i class="fas fa-arrow-left"></i>
                返回首页
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <div style="display: flex; align-items: center; gap: 16px;">
                <h1><i class="fas fa-shield-alt"></i> 资源审核</h1>
                <span class="pending-badge" id="pendingCount">0 条待审核</span>
            </div>
            <button class="refresh-btn" id="refreshBtn">
                <i class="fas fa-sync-alt"></i> 刷新列表
            </button>
        </div>

        <div class="tab-nav">
            <button class="tab-btn active" id="tabAudit" onclick="switchTab('audit')">
                <i class="fas fa-check-circle"></i> 待审核资源
            </button>
            <button class="tab-btn" id="tabCardKey" onclick="switchTab('cardkey')">
                <i class="fas fa-key"></i> 卡密管理
            </button>
            <button class="tab-btn" id="tabResource" onclick="switchTab('resource')">
                <i class="fas fa-edit"></i> 资源管理
            </button>
        </div>

        <div id="contentArea">
            <div class="loading">
                <i class="fas fa-spinner"></i>
                <p style="margin-top: 12px; color: #90b0d1;">加载中...</p>
            </div>
        </div>

        <div id="cardKeyArea" style="display: none;">
            <div class="cardkey-panel">
                <div class="cardkey-header">
                    <div class="cardkey-stats">
                        <div class="stat-item">
                            <span class="stat-label">可用卡密</span>
                            <span class="stat-value" id="availableCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">已使用</span>
                            <span class="stat-value" id="usedCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">总卡密数</span>
                            <span class="stat-value" id="totalCount">0</span>
                        </div>
                    </div>
                    <div class="cardkey-actions">
                        <select id="memberTypeFilter" style="padding: 8px 12px; border: 1px solid #3d5a80; border-radius: 4px; background: #1a1a2e; color: #e8e8e8; margin-right: 10px;">
                            <option value="0">全部类型</option>
                            <option value="1">月度会员(30天)</option>
                            <option value="2">季度会员(90天)</option>
                            <option value="3">年度会员(360天)</option>
                            <option value="4">永久会员</option>
                        </select>
                        <button class="btn btn-generate" id="generateBtn">
                            <i class="fas fa-plus"></i> 生成卡密
                        </button>
                        <button class="btn btn-refresh" id="refreshCardKeyBtn">
                            <i class="fas fa-sync-alt"></i> 刷新列表
                        </button>
                    </div>
                </div>

                <div class="generate-form" id="generateForm" style="display: none;">
                    <div class="form-row">
                        <label>生成数量：</label>
                        <input type="number" id="generateCount" min="1" max="100" value="10">
                    </div>
                    <div class="form-row">
                        <label>会员类型：</label>
                        <select id="memberType" style="padding: 8px 12px; border: 1px solid #3d5a80; border-radius: 4px; background: #1a1a2e; color: #e8e8e8;">
                            <option value="1">月度会员(30天)</option>
                            <option value="2">季度会员(90天)</option>
                            <option value="3">年度会员(360天)</option>
                            <option value="4">永久会员</option>
                        </select>
                        <button class="btn btn-confirm" id="confirmGenerateBtn">
                            <i class="fas fa-check"></i> 确认生成
                        </button>
                        <button class="btn btn-cancel" id="cancelGenerateBtn">
                            <i class="fas fa-times"></i> 取消
                        </button>
                    </div>
                </div>

                <div id="cardKeyListArea">
                    <div class="loading">
                        <i class="fas fa-spinner"></i>
                        <p style="margin-top: 12px; color: #90b0d1;">加载中...</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="resourceArea" style="display: none;">
            <div class="cardkey-panel">
                <div class="cardkey-header">
                    <div class="cardkey-stats">
                        <div class="stat-item">
                            <span class="stat-label">资源总数</span>
                            <span class="stat-value" id="resourceTotalCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">已发布</span>
                            <span class="stat-value" id="resourcePublishedCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">待审核</span>
                            <span class="stat-value" id="resourcePendingCount">0</span>
                        </div>
                    </div>
                    <div class="cardkey-actions">
                        <select id="resourceStatusFilter" style="padding: 8px 12px; border: 1px solid #3d5a80; border-radius: 4px; background: #1a1a2e; color: #e8e8e8; margin-right: 10px;">
                            <option value="all">全部状态</option>
                            <option value="0">待审核</option>
                            <option value="1">已发布</option>
                            <option value="2">已拒绝</option>
                        </select>
                        <button class="btn btn-refresh" id="refreshResourceBtn">
                            <i class="fas fa-sync-alt"></i> 刷新列表
                        </button>
                    </div>
                </div>

                <div id="resourceListArea">
                    <div class="loading">
                        <i class="fas fa-spinner"></i>
                        <p style="margin-top: 12px; color: #90b0d1;">加载中...</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="resourceEditModal" class="modal" style="display: none;">
            <div class="modal-content" style="max-width: 700px;">
                <div class="modal-header">
                    <h3><i class="fas fa-edit"></i> 编辑资源</h3>
                    <span class="modal-close" onclick="closeResourceEditModal()">&times;</span>
                </div>
                <form id="resourceEditForm">
                    <input type="hidden" id="editResourceId">
                    <div class="form-row">
                        <label>标题：</label>
                        <input type="text" id="editResourceTitle" style="flex: 1;" required>
                    </div>
                    <div class="form-row">
                        <label>分类：</label>
                        <select id="editResourceCategory" style="padding: 8px 12px; border: 1px solid #3d5a80; border-radius: 4px; background: #1a1a2e; color: #e8e8e8; flex: 1;">
                            <option value="资源">资源</option>
                            <option value="游戏">游戏</option>
                            <option value="软件">软件</option>
                            <option value="教程">教程</option>
                            <option value="资讯">资讯</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>简介：</label>
                        <input type="text" id="editResourceSummary" style="flex: 1;">
                    </div>
                    <div class="form-row">
                        <label>封面图片：</label>
                        <input type="text" id="editResourceImage" style="flex: 1;" placeholder="图片URL">
                    </div>
                    <div class="form-row">
                        <label>下载链接：</label>
                        <input type="text" id="editResourceDownloadLink" style="flex: 1;">
                    </div>
                    <div class="form-row">
                        <label>下载密码：</label>
                        <input type="text" id="editResourceDownloadPassword" style="flex: 1;">
                    </div>
                    <div class="form-row">
                        <label>状态：</label>
                        <select id="editResourceStatus" style="padding: 8px 12px; border: 1px solid #3d5a80; border-radius: 4px; background: #1a1a2e; color: #e8e8e8; flex: 1;">
                            <option value="0">待审核</option>
                            <option value="1">已发布</option>
                            <option value="2">已拒绝</option>
                        </select>
                    </div>
                    <div class="form-row" style="flex-direction: column;">
                        <label>内容：</label>
                        <textarea id="editResourceContent" rows="6" style="width: 100%; padding: 8px 12px; border: 1px solid #3d5a80; border-radius: 4px; background: #1a1a2e; color: #e8e8e8; resize: vertical;"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-confirm" onclick="saveResourceEdit()">
                            <i class="fas fa-check"></i> 保存修改
                        </button>
                        <button type="button" class="btn btn-cancel" onclick="closeResourceEditModal()">
                            <i class="fas fa-times"></i> 取消
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function getHost() {
            return '';
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = isError ? 'toast error show' : 'toast success show';
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function formatDate(dateString) {
            if (!dateString) return '未知';
            const date = new Date(dateString);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function checkAdmin() {
            const userInfo = localStorage.getItem('userInfo');
            if (!userInfo) {
                showToast('请先登录', true);
                setTimeout(() => window.location.href = '/', 1500);
                return null;
            }
            try {
                const user = JSON.parse(userInfo);
                if (user.role !== '1') {
                    showToast('您没有管理员权限', true);
                    setTimeout(() => window.location.href = '/', 1500);
                    return null;
                }
                return user;
            } catch (e) {
                showToast('登录信息解析失败', true);
                setTimeout(() => window.location.href = '/', 1500);
                return null;
            }
        }

        function loadPendingResources() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p style="margin-top: 12px; color: #90b0d1;">加载中...</p>
                </div>
            `;

            fetch(`/api/resources/pending`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        renderResources(data.resources || []);
                        document.getElementById('pendingCount').textContent =
                            (data.resources || []).length + ' 条待审核';
                    } else {
                        showToast(data.message || '加载失败', true);
                    }
                })
                .catch(error => {
                    console.error('加载待审核资源失败:', error);
                    showToast('网络错误', true);
                });
        }

        function renderResources(resources) {
            const contentArea = document.getElementById('contentArea');

            if (resources.length === 0) {
                contentArea.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-check-circle"></i>
                        <h2>太棒了！</h2>
                        <p>目前没有待审核的资源</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="resource-list">';
            resources.forEach(resource => {
                html += `
                    <div class="resource-card" id="resource-${resource.id}">
                        <div class="resource-header">
                            <div class="resource-title">${escapeHtml(resource.title)}</div>
                            <div class="resource-meta">
                                <span class="meta-tag category">${escapeHtml(resource.category)}</span>
                                <span class="meta-tag author"><i class="fas fa-user"></i> ${escapeHtml(resource.author)}</span>
                                <span class="meta-tag time"><i class="far fa-clock"></i> ${formatDate(resource.createdAt)}</span>
                            </div>
                        </div>
                        <div class="resource-summary">${escapeHtml(resource.summary)}</div>
                        <div class="resource-content">${escapeHtml(resource.content)}</div>
                        <div class="resource-actions">
                            <button class="btn btn-reject" onclick="rejectResource(${resource.id})">
                                <i class="fas fa-times"></i> 拒绝
                            </button>
                            <button class="btn btn-approve" onclick="approveResource(${resource.id})">
                                <i class="fas fa-check"></i> 通过审核
                            </button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            contentArea.innerHTML = html;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function approveResource(id) {
            const card = document.getElementById(`resource-${id}`);
            const btns = card.querySelectorAll('.btn');
            btns.forEach(btn => btn.disabled = true);

            fetch(`/api/resources/audit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, status: 1 })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast('资源已通过审核');
                    card.style.opacity = '0.5';
                    card.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        loadPendingResources();
                    }, 500);
                } else {
                    showToast(data.message || '操作失败', true);
                    btns.forEach(btn => btn.disabled = false);
                }
            })
            .catch(error => {
                console.error('审核失败:', error);
                showToast('网络错误', true);
                btns.forEach(btn => btn.disabled = false);
            });
        }

        function rejectResource(id) {
            const card = document.getElementById(`resource-${id}`);
            const btns = card.querySelectorAll('.btn');
            btns.forEach(btn => btn.disabled = true);

            fetch(`/api/resources/audit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, status: -1 })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast('资源已拒绝');
                    card.style.opacity = '0.5';
                    card.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        loadPendingResources();
                    }, 500);
                } else {
                    showToast(data.message || '操作失败', true);
                    btns.forEach(btn => btn.disabled = false);
                }
            })
            .catch(error => {
                console.error('审核失败:', error);
                showToast('网络错误', true);
                btns.forEach(btn => btn.disabled = false);
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            const admin = checkAdmin();
            if (!admin) return;

            loadPendingResources();

            document.getElementById('refreshBtn').addEventListener('click', loadPendingResources);

            document.getElementById('generateBtn').addEventListener('click', function() {
                document.getElementById('generateForm').style.display = 'block';
            });

            document.getElementById('cancelGenerateBtn').addEventListener('click', function() {
                document.getElementById('generateForm').style.display = 'none';
            });

            document.getElementById('confirmGenerateBtn').addEventListener('click', generateCardKeys);

            document.getElementById('refreshCardKeyBtn').addEventListener('click', loadCardKeyList);
            
            document.getElementById('memberTypeFilter').addEventListener('change', loadCardKeyList);
        });

        function deleteCardKey(id) {
            if (!confirm('确定要删除这条卡密记录吗？')) {
                return;
            }

            fetch(`/api/cardkey/delete/${id}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast('删除成功');
                    loadCardKeyList();
                } else {
                    showToast('删除失败: ' + data.message, true);
                }
            })
            .catch(error => {
                console.error('删除卡密失败:', error);
                showToast('网络错误', true);
            });
        }

        let currentTab = 'audit';

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            if (tab === 'audit') {
                document.getElementById('tabAudit').classList.add('active');
                document.getElementById('contentArea').style.display = 'block';
                document.getElementById('cardKeyArea').style.display = 'none';
                document.getElementById('resourceArea').style.display = 'none';
            } else if (tab === 'cardkey') {
                document.getElementById('tabCardKey').classList.add('active');
                document.getElementById('contentArea').style.display = 'none';
                document.getElementById('cardKeyArea').style.display = 'block';
                document.getElementById('resourceArea').style.display = 'none';
                loadCardKeyList();
            } else if (tab === 'resource') {
                document.getElementById('tabResource').classList.add('active');
                document.getElementById('contentArea').style.display = 'none';
                document.getElementById('cardKeyArea').style.display = 'none';
                document.getElementById('resourceArea').style.display = 'block';
                loadResourceList();
            }
        }

        function loadResourceList() {
            const listArea = document.getElementById('resourceListArea');
            listArea.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><p style="margin-top: 12px; color: #90b0d1;">加载中...</p></div>';

            const statusFilter = document.getElementById('resourceStatusFilter').value;

            fetch('/api/resources/all')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        let resources = data.resources || [];
                        
                        if (statusFilter !== 'all') {
                            resources = resources.filter(r => r.status === parseInt(statusFilter));
                        }
                        
                        updateResourceStats(data.resources || []);
                        renderResourceList(resources);
                    } else {
                        showToast('加载资源列表失败', true);
                    }
                })
                .catch(error => {
                    console.error('加载资源列表失败:', error);
                    showToast('网络错误', true);
                });
        }

        function updateResourceStats(resources) {
            const total = resources.length;
            const published = resources.filter(r => r.status === 1).length;
            const pending = resources.filter(r => r.status === 0).length;

            document.getElementById('resourceTotalCount').textContent = total;
            document.getElementById('resourcePublishedCount').textContent = published;
            document.getElementById('resourcePendingCount').textContent = pending;
        }

        function renderResourceList(resources) {
            const listArea = document.getElementById('resourceListArea');

            if (resources.length === 0) {
                listArea.innerHTML = '<div class="cardkey-empty"><i class="fas fa-folder-open" style="font-size: 2rem; margin-bottom: 12px;"></i><p>暂无资源记录</p></div>';
                return;
            }

            let html = '<div class="cardkey-list">';
            resources.forEach(resource => {
                const statusClass = resource.status === 1 ? 'published' : (resource.status === 0 ? 'pending' : 'rejected');
                const statusText = resource.status === 1 ? '已发布' : (resource.status === 0 ? '待审核' : '已拒绝');
                html += `
                    <div class="cardkey-card">
                        <div class="cardkey-key" style="font-size: 0.95rem;">${resource.title}</div>
                        <div class="cardkey-meta">
                            <span class="cardkey-type">${resource.category || '未分类'}</span>
                            <span class="cardkey-status ${statusClass}">${statusText}</span>
                            <span>${formatDate(resource.createdAt)}</span>
                        </div>
                        ${resource.summary ? '<div style="color: #90b0d1; font-size: 0.8rem; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + resource.summary + '</div>' : ''}
                        <button class="cardkey-delete-btn" onclick="openResourceEditModal(${resource.id})" title="编辑资源" style="background: rgba(100, 180, 255, 0.15); color: #64b5f6; right: 36px;">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="cardkey-delete-btn" onclick="deleteResource(${resource.id})" title="删除资源">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
            });
            html += '</div>';
            listArea.innerHTML = html;
        }

        function openResourceEditModal(resourceId) {
            fetch('/api/resources/' + resourceId)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const resource = data.resource;
                        document.getElementById('editResourceId').value = resource.id;
                        document.getElementById('editResourceTitle').value = resource.title || '';
                        document.getElementById('editResourceCategory').value = resource.category || '资源';
                        document.getElementById('editResourceSummary').value = resource.summary || '';
                        document.getElementById('editResourceImage').value = resource.image || '';
                        document.getElementById('editResourceDownloadLink').value = resource.downloadLink || '';
                        document.getElementById('editResourceDownloadPassword').value = resource.downloadPassword || '';
                        document.getElementById('editResourceStatus').value = resource.status;
                        document.getElementById('editResourceContent').value = resource.content || '';
                        document.getElementById('resourceEditModal').style.display = 'flex';
                    } else {
                        showToast('获取资源信息失败', true);
                    }
                })
                .catch(error => {
                    console.error('获取资源信息失败:', error);
                    showToast('网络错误', true);
                });
        }

        function closeResourceEditModal() {
            document.getElementById('resourceEditModal').style.display = 'none';
        }

        function saveResourceEdit() {
            const id = document.getElementById('editResourceId').value;
            if (!id) {
                showToast('资源ID不能为空', true);
                return;
            }

            const resource = {
                id: parseInt(id),
                title: document.getElementById('editResourceTitle').value,
                category: document.getElementById('editResourceCategory').value,
                summary: document.getElementById('editResourceSummary').value,
                image: document.getElementById('editResourceImage').value,
                downloadLink: document.getElementById('editResourceDownloadLink').value,
                downloadPassword: document.getElementById('editResourceDownloadPassword').value,
                status: parseInt(document.getElementById('editResourceStatus').value),
                content: document.getElementById('editResourceContent').value
            };

            fetch('/api/resources/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(resource)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast('资源更新成功');
                    closeResourceEditModal();
                    loadResourceList();
                } else {
                    showToast('更新失败: ' + data.message, true);
                }
            })
            .catch(error => {
                console.error('更新资源失败:', error);
                showToast('网络错误', true);
            });
        }

        function deleteResource(id) {
            if (!confirm('确定要删除这条资源吗？')) {
                return;
            }

            fetch(`/api/resources/delete/${id}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast('删除成功');
                    loadResourceList();
                } else {
                    showToast('删除失败: ' + data.message, true);
                }
            })
            .catch(error => {
                console.error('删除资源失败:', error);
                showToast('网络错误', true);
            });
        }

        document.getElementById('refreshResourceBtn').addEventListener('click', loadResourceList);
        document.getElementById('resourceStatusFilter').addEventListener('change', loadResourceList);

        function loadCardKeyList() {
            const listArea = document.getElementById('cardKeyListArea');
            listArea.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><p style="margin-top: 12px; color: #90b0d1;">加载中...</p></div>';

            const memberType = document.getElementById('memberTypeFilter').value;
            const url = memberType && memberType != '0' 
                ? `/api/cardkey/list?memberType=${memberType}` 
                : '/api/cardkey/list';

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        updateCardKeyStats(data.data || []);
                        renderCardKeyList(data.data || []);
                    } else {
                        showToast('加载卡密列表失败', true);
                    }
                })
                .catch(error => {
                    console.error('加载卡密列表失败:', error);
                    showToast('网络错误', true);
                });
        }

        function updateCardKeyStats(cardKeys) {
            const total = cardKeys.length;
            const used = cardKeys.filter(k => k.status === 1).length;
            const available = total - used;

            document.getElementById('availableCount').textContent = available;
            document.getElementById('usedCount').textContent = used;
            document.getElementById('totalCount').textContent = total;
        }

        function renderCardKeyList(cardKeys) {
            const listArea = document.getElementById('cardKeyListArea');

            if (cardKeys.length === 0) {
                listArea.innerHTML = '<div class="cardkey-empty"><i class="fas fa-key" style="font-size: 2rem; margin-bottom: 12px;"></i><p>暂无卡密记录</p></div>';
                return;
            }

            let html = '<div class="cardkey-list">';
            cardKeys.forEach(key => {
                const isUsed = key.status === 1;
                const memberTypeName = key.memberTypeName || getMemberTypeName(key.memberType);
                html += `
                    <div class="cardkey-card ${isUsed ? 'used' : ''}">
                        <div class="cardkey-key">${key.cardKey}</div>
                        <div class="cardkey-meta">
                            <span class="cardkey-type">${memberTypeName}</span>
                            <span class="cardkey-status ${isUsed ? 'used' : 'available'}">
                                ${isUsed ? '已使用' : '可用'}
                            </span>
                            <span>${formatDate(key.createdAt)}</span>
                        </div>
                        ${isUsed && key.usedBy ? '<div class="cardkey-used-by">使用者: ' + key.usedBy + '</div>' : ''}
                        <button class="cardkey-delete-btn" onclick="deleteCardKey(${key.id})" title="删除卡密">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
            });
            html += '</div>';
            listArea.innerHTML = html;
        }

        function getMemberTypeName(type) {
            switch (type) {
                case 1: return '月度会员(30天)';
                case 2: return '季度会员(90天)';
                case 3: return '年度会员(360天)';
                case 4: return '永久会员';
                default: return '未知';
            }
        }

        function generateCardKeys() {
            const count = parseInt(document.getElementById('generateCount').value);
            const memberType = parseInt(document.getElementById('memberType').value);

            if (isNaN(count) || count < 1 || count > 100) {
                showToast('生成数量必须在1-100之间', true);
                return;
            }

            const confirmBtn = document.getElementById('confirmGenerateBtn');
            confirmBtn.disabled = true;
            confirmBtn.innerHTML = '<i class="fas fa-spinner"></i> 生成中...';

            fetch('/api/cardkey/generate?count=' + count + '&memberType=' + memberType, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showToast(data.message || '成功生成 ' + data.count + ' 个卡密');
                    document.getElementById('generateForm').style.display = 'none';
                    showGeneratedKeys(data.keys, data.memberTypeName);
                    loadCardKeyList();
                } else {
                    showToast(data.message || '生成失败', true);
                }
            })
            .catch(error => {
                console.error('生成卡密失败:', error);
                showToast('网络错误', true);
            })
            .finally(() => {
                confirmBtn.disabled = false;
                confirmBtn.innerHTML = '<i class="fas fa-check"></i> 确认生成';
            });
        }

        function showGeneratedKeys(keys, memberTypeName) {
            const listArea = document.getElementById('cardKeyListArea');
            let html = '<div class="generated-keys-box">';
            html += '<div class="generated-keys-title"><i class="fas fa-check-circle"></i> 成功生成以下 ' + (memberTypeName || '') + ' 卡密（点击复制）：</div>';
            html += '<div class="generated-keys-list">';
            keys.forEach(key => {
                html += '<div class="generated-key-item" onclick="copyToClipboard(\'' + key + '\')">' + key + '</div>';
            });
            html += '</div></div>';
            html += '<div id="cardKeyListAreaInner"></div>';
            listArea.innerHTML = html;
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(function() {
                showToast('已复制到剪贴板: ' + text);
            }, function() {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('已复制到剪贴板: ' + text);
            });
        }
    </script>
