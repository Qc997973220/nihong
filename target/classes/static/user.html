<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 · NEON 霓虹之都</title>
    <!-- Font Awesome 6 免费版 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts：Inter + Orbitron -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            background: #0b0e14;
            color: #eef3fc;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                    linear-gradient(rgba(120, 180, 255, 0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(120, 180, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 1;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 24px;
            width: 100%;
            flex: 1;
            position: relative;
            z-index: 10;
        }
        /* 导航栏 */
        .navbar {
            background: rgba(10, 17, 28, 0.6);
            backdrop-filter: blur(20px) saturate(200%);
            border-bottom: 1px solid rgba(90, 160, 255, 0.2);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            padding: 0 24px;
            max-width: 1300px;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 450;
            background: linear-gradient(135deg, #e0efff, #b2d9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
            filter: drop-shadow(0 0 8px #3f8eff);
            white-space: nowrap;
        }
        .back-link {
            color: #5ba5ff;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s, text-shadow 0.2s;
        }
        .back-link:hover {
            color: white;
            text-shadow: 0 0 8px #4d9eff;
        }
        /* 个人资料卡片 */
        .profile-card {
            background: rgba(20, 30, 50, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(90, 160, 255, 0.2);
            margin-top: 40px;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .avatar-container {
            position: relative;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(90, 160, 255, 0.3);
            box-shadow: 0 0 20px rgba(90, 160, 255, 0.3);
        }
        .avatar-placeholder {
            width: 120px;
            height: 120px;
            background: linear-gradient(145deg, #1e4f9e, #6d3fc9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 2.5rem;
            box-shadow: 0 0 20px #3f6eff;
        }
        .user-info h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #ffffff;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(95, 158, 255, 0.5);
        }
        .user-info p {
            margin: 5px 0;
            color: #90b0d1;
            font-size: 1.1rem;
        }
        .upload-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: rgba(91, 165, 255, 0.2);
            border: 1px solid rgba(91, 165, 255, 0.5);
            border-radius: 60px;
            color: #5ba5ff;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .upload-btn:hover {
            background: rgba(91, 165, 255, 0.3);
            border-color: #5ba5ff;
            box-shadow: 0 0 15px rgba(91, 165, 255, 0.5);
        }
        .file-input {
            display: none;
        }
        .info-section {
            margin-bottom: 30px;
        }
        .info-section h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(90, 160, 255, 0.2);
            padding-bottom: 10px;
            color: #b8dcff;
        }
        .info-item {
            display: flex;
            margin-bottom: 15px;
            align-items: center;
        }
        .info-label {
            width: 120px;
            font-weight: 600;
            color: #90b0d1;
        }
        .info-value {
            flex: 1;
            color: #eef3fc;
            font-size: 1.1rem;
        }
        .action-buttons {
            margin-top: 40px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 550;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(105deg, #1f4f9e, #2d6fc4);
            color: white;
            box-shadow: 0 5px 15px -5px #0a2a5a, 0 0 0 1px #5b9eff inset;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-primary:hover {
            background: linear-gradient(105deg, #2a5fb0, #3f82da);
            box-shadow: 0 0 30px #0077ff;
            transform: scale(1.02);
        }
        .btn-secondary {
            background: rgba(120, 120, 120, 0.3);
            color: #b0b0b0;
            border: 1px solid rgba(120, 120, 120, 0.5);
        }
        .btn-secondary:hover {
            background: rgba(150, 150, 150, 0.4);
            color: white;
            border-color: #999;
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <nav class="navbar">
        <div class="container">
            <div class="logo">霓虹资源站</div>
            <a href="/" class="back-link">
                <i class="fas fa-arrow-left"></i>
                返回首页
            </a>
        </div>
    </nav>
    <div class="container">
        <div class="profile-card">
            <div class="profile-header">
                <div class="user-info">
                    <div style="display: flex; align-items: center; gap: 16px;">
                        <div class="avatar-container" style="width: 40px; height: 40px;">
                            <div id="avatarPlaceholder" class="avatar-placeholder" style="width: 40px; height: 40px; font-size: 1.5rem; display: block;"></div>
                            <img id="avatar" class="avatar" style="width: 40px; height: 40px; display: none; position: absolute; top: 0; left: 0;" alt="用户头像">
                            <input type="file" id="fileInput" class="file-input" accept="image/*">
                            <label for="fileInput" style="position: absolute; top: 0; left: 0; width: 40px; height: 40px; border-radius: 50%; opacity: 0; cursor: pointer; z-index: 10;"></label>
                        </div>
                        <h1 id="nickname" style="margin: 0; font-size: 1.8rem;">用户名</h1>
                    </div>
                    <p>普通会员 · 欢迎回来</p>
                </div>
            </div>

            <div class="info-section">
                <h2>基本信息</h2>
                <div class="info-item">
                    <div class="info-label">用户名：</div>
                    <div class="info-value" id="infoUserName"></div>
                </div>
                <div class="info-item">
                    <div class="info-label">昵称：</div>
                    <div class="info-value" id="infoNickname"></div>
                </div>
                <div class="info-item">
                    <div class="info-label">邮箱：</div>
                    <div class="info-value" id="userEmail">未设置</div>
                </div>
                <div class="info-item">
                    <div class="info-label">电话：</div>
                    <div class="info-value" id="userPhone">未绑定</div>
                </div>
                <div class="info-item">
                    <div class="info-label">注册时间：</div>
                    <div class="info-value" id="registerTime">2026-02-25</div>
                </div>
                <div class="info-item">
                    <div class="info-label">积分：</div>
                    <div class="info-value" id="userPoints">1280</div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-secondary" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                    退出登录
                </button>
            </div>
        </div>
    </div>

<script>
    // 从 localStorage 获取用户信息
    let username = null;
    let userData = null;
    const userInfo = localStorage.getItem('userInfo');
    if (!userInfo) {
        // 如果没登录，直接跳回首页
        window.location.href = '/';
    } else {
        try {
            userData = JSON.parse(userInfo);
            username = userData.username;
            document.getElementById('nickname').innerText = username;
            document.getElementById('infoUserName').innerText = username;
            document.getElementById('infoNickname').innerText = username;
            document.getElementById('avatarPlaceholder').innerText = username.charAt(0).toUpperCase();
            
            // 检查用户是否有头像
            if (userData.avatar) {
                document.getElementById('avatar').src = userData.avatar;
                document.getElementById('avatar').style.display = 'block';
                document.getElementById('avatarPlaceholder').style.display = 'none';
            }
        } catch (e) {
            console.error('解析用户信息失败:', e);
            window.location.href = '/';
        }
    }

    // 上传头像功能已禁用
    document.getElementById('fileInput').addEventListener('change', function(e) {
        alert('头像上传功能已禁用，所有用户使用系统默认字母头像');
        e.target.value = ''; // 清除已选择的文件
    });

    // 退出登录
    document.getElementById('logoutBtn').addEventListener('click', function() {
        localStorage.removeItem('userInfo');
        window.location.href = '/';
    });
</script>
</body>
</html>
