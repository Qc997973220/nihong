<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#061326"/><stop offset="1" stop-color="#030812"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#56e7ff"/><stop offset="1" stop-color="#8b75ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="70" y="78" fill="#eaf8ff" font-size="34" font-family="Microsoft YaHei, Arial" font-weight="700">MT 流程图</text>
  <text x="70" y="114" fill="#88aabc" font-size="16" font-family="Microsoft YaHei, Arial">扫码结果查询物料明细、校验、回写批次数据流程</text>
  <g fill="none" stroke="url(#g)" stroke-width="4" filter="url(#glow)">
    <path d="M220 255h210M570 255h210M920 255h210M1130 315v140H920M780 455H570M430 455H220"/>
  </g>
  <g font-family="Microsoft YaHei, Arial" text-anchor="middle">
    <g fill="#0b2138" stroke="#56e7ff" stroke-width="2"><rect x="90" y="195" width="260" height="120" rx="10"/><text x="220" y="248" fill="#eaf8ff" font-size="24" font-weight="700">扫码结果</text><text x="220" y="282" fill="#8fdcef" font-size="15">station 返回 D 码</text></g>
    <g fill="#0b2138" stroke="#56e7ff" stroke-width="2"><rect x="430" y="195" width="260" height="120" rx="10"/><text x="560" y="248" fill="#eaf8ff" font-size="24" font-weight="700">中控查询 MT</text><text x="560" y="282" fill="#8fdcef" font-size="15">根据 D 码拉取明细</text></g>
    <g fill="#0b2138" stroke="#8b75ff" stroke-width="2"><rect x="780" y="195" width="260" height="120" rx="10"/><text x="910" y="248" fill="#eaf8ff" font-size="24" font-weight="700">下发 mtData</text><text x="910" y="282" fill="#b9adff" font-size="15">WebSocket 到 station</text></g>
    <g fill="#0b2138" stroke="#8b75ff" stroke-width="2"><rect x="1130" y="195" width="220" height="120" rx="10"/><text x="1240" y="248" fill="#eaf8ff" font-size="24" font-weight="700">物料校验</text><text x="1240" y="282" fill="#b9adff" font-size="15">dataContrast</text></g>
    <g fill="#0b2138" stroke="#56e7ff" stroke-width="2"><rect x="790" y="395" width="260" height="120" rx="10"/><text x="920" y="448" fill="#eaf8ff" font-size="24" font-weight="700">写 PLC 参数</text><text x="920" y="482" fill="#8fdcef" font-size="15">批次总量 / 物料信息</text></g>
    <g fill="#0b2138" stroke="#56e7ff" stroke-width="2"><rect x="430" y="395" width="260" height="120" rx="10"/><text x="560" y="448" fill="#eaf8ff" font-size="24" font-weight="700">投料称重</text><text x="560" y="482" fill="#8fdcef" font-size="15">投入明细累计</text></g>
    <g fill="#0b2138" stroke="#56e7ff" stroke-width="2"><rect x="90" y="395" width="260" height="120" rx="10"/><text x="220" y="448" fill="#eaf8ff" font-size="24" font-weight="700">回传 MT</text><text x="220" y="482" fill="#8fdcef" font-size="15">批次结算 / 物料投入</text></g>
  </g>
