<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#030812"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#ff56a6"/><stop offset="1" stop-color="#56e7ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="70" y="78" fill="#eaf8ff" font-size="34" font-family="Microsoft YaHei, Arial" font-weight="700">MOM 流程图</text>
  <text x="70" y="114" fill="#88aabc" font-size="16" font-family="Microsoft YaHei, Arial">生产任务、设备状态、人工介入和批次闭环流程</text>
  <g fill="none" stroke="url(#g)" stroke-width="4" filter="url(#glow)">
    <path d="M230 250h250M620 250h250M1010 250v180M1010 430H760M620 430H370M230 430v-180"/>
  </g>
