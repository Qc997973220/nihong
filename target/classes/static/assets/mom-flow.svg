    <g fill="#0b2138" stroke="#56e7ff" stroke-width="2"><rect x="480" y="190" width="260" height="120" rx="10"/><text x="610" y="243" fill="#eaf8ff" font-size="24" font-weight="700">中控编排</text><text x="610" y="276" fill="#8fdcef" font-size="15">任务状态 / 互斥</text></g>
    <g fill="#0b2138" stroke="#56e7ff" stroke-width="2"><rect x="870" y="190" width="280" height="120" rx="10"/><text x="1010" y="243" fill="#eaf8ff" font-size="24" font-weight="700">设备执行</text><text x="1010" y="276" fill="#8fdcef" font-size="15">AGV / station / PLC</text></g>
    <g fill="#0b2138" stroke="#ff56a6" stroke-width="2"><rect x="870" y="370" width="280" height="120" rx="10"/><text x="1010" y="423" fill="#eaf8ff" font-size="24" font-weight="700">人工介入</text><text x="1010" y="456" fill="#f5a5cf" font-size="15">达标 / 异常 / 强制结束</text></g>
    <g fill="#0b2138" stroke="#56e7ff" stroke-width="2"><rect x="480" y="370" width="260" height="120" rx="10"/><text x="610" y="423" fill="#eaf8ff" font-size="24" font-weight="700">批次结算</text><text x="610" y="456" fill="#8fdcef" font-size="15">投入量 / 退料 / 补料</text></g>
    <g fill="#0b2138" stroke="#56e7ff" stroke-width="2"><rect x="100" y="370" width="260" height="120" rx="10"/><text x="230" y="423" fill="#eaf8ff" font-size="24" font-weight="700">状态回写</text><text x="230" y="456" fill="#8fdcef" font-size="15">MOM 闭环 / 看板展示</text></g>
