<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源详情 · NEON霓虹之都</title>
    <!-- Font Awesome 6 免费版 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts：Inter + Orbitron -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* ========== 全局样式（基于 index.html 调整） ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            background: #0b0e14;
            color: #eef3fc;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* 关键修正：改为列方向 */
            position: relative;
            overflow-x: hidden;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                    linear-gradient(rgba(120, 180, 255, 0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(120, 180, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        /* 导航栏 */
        .navbar {
            background: rgba(10, 17, 28, 0.6);
            backdrop-filter: blur(20px) saturate(200%);
            border-bottom: 1px solid rgba(90, 160, 255, 0.2);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 450;
            background: linear-gradient(135deg, #e0efff, #b2d9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
            filter: drop-shadow(0 0 8px #3f8eff);
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #c5dcff;
            font-weight: 430;
            font-size: 1rem;
            transition: color 0.2s, text-shadow 0.2s;
            position: relative;
            white-space: nowrap;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -6px; left: 0;
            width: 0; height: 2px;
            background: #5ba5ff;
            box-shadow: 0 0 15px #0077ff;
            transition: width 0.2s ease;
        }
        .nav-links a:hover {
            color: white;
            text-shadow: 0 0 8px #4d9eff;
        }
        .nav-links a:hover::after {
            width: 100%;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            background: rgba(20, 40, 70, 0.4);
            backdrop-filter: blur(10px);
            padding: 6px 20px 6px 12px;
            border-radius: 60px;
            border: 1px solid rgba(0, 180, 255, 0.25);
            transition: 0.2s;
            white-space: nowrap;
        }
        .user-info:hover {
            background: rgba(30, 60, 110, 0.6);
            border-color: #4da6ff;
            box-shadow: 0 0 25px #1e88e5;
        }
        .user-avatar {
            width: 36px; height: 36px;
            background: linear-gradient(145deg, #1e4f9e, #6d3fc9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 500;
            font-size: 1rem;
            box-shadow: 0 0 15px #3f6eff;
        }
        .user-name {
            font-weight: 480;
            color: #edf5ff;
        }

        /* 页脚 */
        .footer {
            background: rgba(8, 15, 26, 0.7);
            backdrop-filter: blur(12px);
            padding: 24px 0;
            border-top: 1px solid #1e4f8f;
            text-align: center;
            color: #90b0d1;
            font-weight: 350;
            margin-top: auto; /* 推到底部 */
        }

        /* ========== 详情页专用样式 ========== */
        .detail-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1; /* 占满剩余空间 */
            position: relative;
            z-index: 10; /* 确保内容在背景之上 */
        }
        .article-title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ffffff;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 0 10px rgba(95, 158, 255, 0.5);
        }
        .article-cover {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 20px;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .article-meta {
            color: #90b0d1;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .article-content {
            background: rgba(20, 30, 50, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(90, 160, 255, 0.2);
            line-height: 1.8;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        .comment-section {
            background: rgba(15, 25, 40, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(90, 160, 255, 0.2);
        }
        .comment-item {
            border-bottom: 1px solid #2a4f80;
            padding: 15px 0;
        }
        .comment-item:last-child {
            border-bottom: none;
        }
        .comment-author {
            font-weight: 600;
            color: #b8dcff;
        }
        .comment-time {
            color: #90b0d1;
            font-size: 0.85rem;
            margin-left: 10px;
        }
        .comment-content {
            margin-top: 8px;
        }

        /* 评论操作按钮样式 */
        .comment-actions {
            margin-top: 10px;
            display: flex;
            gap: 15px;
        }
        .like-btn, .dislike-btn, .reply-btn {
            background: transparent;
            border: 1px solid rgba(90, 160, 255, 0.3);
            color: #90b0d1;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .like-btn:hover {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4caf50;
            color: #4caf50;
        }
        .reply-btn:hover {
            background: rgba(33, 150, 243, 0.2);
            border-color: #2196f3;
            color: #2196f3;
        }
        .like-btn.active {
            color: #ff6b6b;
            background-color: #ffe6e6;
        }

        .comment-actions .like-btn.active {
            color: #ff6b6b;
            background-color: #ffe6e6;
        }

        .comment-actions .dislike-btn.active {
            color: #4dabf7;
            background-color: #e6f3ff;
        }

        /* 回复表单样式 */
        .reply-form {
            margin-top: 15px;
            padding: 15px;
            background: rgba(20, 35, 60, 0.4);
            border-radius: 15px;
            border: 1px solid rgba(90, 160, 255, 0.2);
        }
        .reply-textarea {
            width: 100%;
            background: rgba(8, 18, 32, 0.6);
            border: 1.5px solid rgba(90, 160, 255, 0.25);
            border-radius: 12px;
            padding: 12px;
            color: #e0f0ff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            resize: vertical;
            min-height: 60px;
            margin-bottom: 10px;
        }
        .reply-textarea:focus {
            border-color: #3f9eff;
            background: rgba(10, 25, 45, 0.8);
            box-shadow: 0 0 15px #1e88e5;
        }
        .reply-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .submit-reply-btn, .cancel-reply-btn {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .submit-reply-btn {
            background: linear-gradient(105deg, #1f4f9e, #2d6fc4);
            color: white;
        }
        .submit-reply-btn:hover {
            background: linear-gradient(105deg, #2a5fb0, #3f82da);
            box-shadow: 0 0 20px #0077ff;
        }
        .cancel-reply-btn {
            background: rgba(120, 120, 120, 0.3);
            color: #b0b0b0;
        }
        .cancel-reply-btn:hover {
            background: rgba(150, 150, 150, 0.4);
            color: white;
        }

        /* 嵌套回复样式 */
        .reply-item {
            margin-left: 30px;
            border-left: 2px solid rgba(90, 160, 255, 0.3);
            padding-left: 15px;
            background: rgba(10, 20, 35, 0.3);
            border-radius: 0 12px 12px 0;
            margin-top: 10px;
        }
        .replies-container {
            margin-top: 15px;
        }
        .show-more-replies {
            text-align: center;
            margin-top: 10px;
        }
        .show-more-btn {
            background: transparent;
            border: 1px solid rgba(90, 160, 255, 0.3);
            color: #5ba5ff;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .show-more-btn:hover {
            background: rgba(90, 160, 255, 0.1);
            border-color: #5ba5ff;
        }

        /* 新增：评论输入区域样式 */
        .comment-input-area {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #commentContent {
            background: rgba(8, 18, 32, 0.6);
            border: 1.5px solid rgba(90, 160, 255, 0.25);
            border-radius: 20px;
            padding: 12px 18px;
            color: #e0f0ff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            resize: vertical;
            min-height: 80px;
        }
        #commentContent:focus {
            border-color: #3f9eff;
            background: rgba(10, 25, 45, 0.8);
            box-shadow: 0 0 20px #1e88e5;
        }
        #submitCommentBtn {
            background: linear-gradient(105deg, #1f4f9e, #2d6fc4);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 550;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            align-self: flex-end;
            box-shadow: 0 5px 15px -5px #0a2a5a, 0 0 0 1px #5b9eff inset;
        }
        #submitCommentBtn:hover {
            background: linear-gradient(105deg, #2a5fb0, #3f82da);
            box-shadow: 0 0 30px #0077ff;
        }
    </style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<!-- 导航栏 -->
<nav class="navbar">
    <div class="container">
        <div class="logo"><i class="fa-solid fa-cube"></i> NEON 霓虹之都</div>
        <div class="nav-links">
            <a href="index.html">首页</a><a href="#">资源</a><a href="#">关于</a>
        </div>
        <div class="user-info" id="userInfo">
            <div class="user-avatar" id="userAvatar">U</div>
            <span class="user-name" id="displayUsername">加载中...</span>
        </div>
        <div class="notification-container" id="notificationContainer">
            <div class="notification-icon" id="notificationIcon" style="position: relative; cursor: pointer; margin-left: 16px;">
                <i class="fa-solid fa-bell" style="font-size: 1.2rem; color: #c5dcff;"></i>
                <span class="notification-badge" id="notificationBadge" style="position: absolute; top: -8px; right: -8px; background: #ff4757; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; visibility: hidden;">0</span>
                <div class="notification-dropdown" id="notificationDropdown" style="position: absolute; top: 100%; right: 0; margin-top: 8px; width: 300px; background: rgba(20, 30, 50, 0.95); backdrop-filter: blur(10px); border-radius: 12px; border: 1px solid rgba(90, 160, 255, 0.2); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); z-index: 1000; display: none;">
                    <div class="notification-header" style="padding: 12px 16px; border-bottom: 1px solid rgba(90, 160, 255, 0.2); font-weight: 600; color: #b8dcff;">消息通知</div>
                    <div class="notification-list" id="notificationList" style="max-height: 300px; overflow-y: auto; padding: 8px 0;"></div>
                    <div class="notification-footer" style="padding: 12px 16px; border-top: 1px solid rgba(90, 160, 255, 0.2); text-align: right;">
                        <button class="mark-all-read" id="markAllReadBtn" style="background: rgba(91, 165, 255, 0.2); border: 1px solid rgba(91, 165, 255, 0.5); border-radius: 60px; color: #5ba5ff; padding: 4px 16px; font-size: 0.9rem; cursor: pointer; transition: all 0.2s;">全部标记为已读</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="detail-container">
    <div id="detailContent">
        <!-- 动态填充 -->
        <p style="color:#90b0d1; text-align:center;">加载中...</p>
    </div>
</div>

<footer class="footer">
    <div class="container">
        <p>© 2026 NEON霓虹之都</p>
    </div>
</footer>

<script>
    // ========== 工具函数 ==========
    function getHost() {
            return '';
        }

    // 显示美观的提示
    function showToast(message, type = 'success') {
        // 移除已存在的提示
        const existingToast = document.getElementById('custom-toast');
        if (existingToast) {
            existingToast.remove();
        }

        const toast = document.createElement('div');
        toast.id = 'custom-toast';
        toast.innerHTML = `
                <div class="toast-content">
                    <i class="fa-solid ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
                    <span>${message}</span>
                </div>
            `;

        // 添加样式
        toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${type === 'success' ? 'rgba(76, 175, 80, 0.95)' : 'rgba(244, 67, 54, 0.95)'};
                color: white;
                padding: 15px 20px;
                border-radius: 12px;
                box-shadow: 0 5px 20px rgba(0,0,0,0.3);
                z-index: 1000;
                backdrop-filter: blur(10px);
                border: 1px solid ${type === 'success' ? 'rgba(76, 175, 80, 0.3)' : 'rgba(244, 67, 54, 0.3)'};
                transform: translateX(100%);
                opacity: 0;
                transition: all 0.3s ease;
                max-width: 300px;
                font-family: 'Inter', sans-serif;
                font-size: 14px;
            `;

        document.body.appendChild(toast);

        // 显示动画
        setTimeout(() => {
            toast.style.transform = 'translateX(0)';
            toast.style.opacity = '1';
        }, 10);

        // 2秒后自动消失
        setTimeout(() => {
            toast.style.transform = 'translateX(100%)';
            toast.style.opacity = '0';
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.remove();
                }
            }, 300);
        }, 2000);
    }

    // ========== 获取 URL 参数 ==========
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    if (!id) {
        window.location.href = 'index.html';
    }

    // ========== 登录检查 ==========
    function isLoggedIn() {
        return localStorage.getItem('userInfo') !== null;
    }

    if (!isLoggedIn()) {
        // 如果没登录，直接跳回首页并显示登录框
        window.location.href = 'index.html';
    }

    // ========== 用户信息 ==========
    let savedUsername = null;
    const savedUserInfo = localStorage.getItem('userInfo');
    if (savedUserInfo) {
        try {
            const userInfo = JSON.parse(savedUserInfo);
            savedUsername = userInfo.username;
            document.getElementById('displayUsername').innerText = userInfo.username;
            if (userInfo.avatar) {
                document.getElementById('userAvatar').innerHTML = `<img src="${userInfo.avatar}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
            } else {
                document.getElementById('userAvatar').innerText = userInfo.username.charAt(0).toUpperCase();
            }
            
            // 获取未读消息数量
            getUnreadMessageCount(savedUsername);
        } catch (e) {
            console.error('解析用户信息失败:', e);
            document.getElementById('displayUsername').innerText = '未登录';
            document.getElementById('userAvatar').innerText = 'U';
        }
    } else {
        document.getElementById('displayUsername').innerText = '未登录';
        document.getElementById('userAvatar').innerText = 'U';
    }
    
    // 获取未读消息数量
    async function getUnreadMessageCount(username) {
        try {
            const response = await fetch(`/messages/unread/count/${username}`);
            if (response.ok) {
                const result = await response.json();
                if (result.success) {
                    const count = result.count || 0;
                    const badge = document.getElementById('notificationBadge');
                    if (count > 0) {
                        badge.innerText = count;
                        badge.style.visibility = 'visible';
                    } else {
                        badge.style.visibility = 'hidden';
                    }
                }
            }
        } catch (error) {
            console.error('获取未读消息数量失败:', error);
        }
    }
    
    // 获取未读消息列表
    async function getUnreadMessages(username) {
        try {
            const response = await fetch(`/messages/unread/${username}`);
            if (response.ok) {
                const result = await response.json();
                if (result.success) {
                    const messages = result.messages || [];
                    const notificationList = document.getElementById('notificationList');
                    notificationList.innerHTML = '';
                    
                    if (messages.length === 0) {
                        notificationList.innerHTML = '<div style="padding: 16px; text-align: center; color: #90b0d1;">暂无未读消息</div>';
                    } else {
                        messages.forEach(message => {
                            const messageItem = document.createElement('div');
                            messageItem.style.padding = '12px 16px';
                            messageItem.style.borderBottom = '1px solid rgba(90, 160, 255, 0.1)';
                            messageItem.style.cursor = 'pointer';
                            messageItem.style.transition = 'background 0.2s';
                            messageItem.style.position = 'relative';
                            messageItem.innerHTML = `
                                <div style="font-size: 0.95rem; color: #eef3fc; margin-bottom: 4px;">${message.content}</div>
                                <div style="font-size: 0.8rem; color: #90b0d1;">${message.createdAt}</div>
                                <div style="position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; background: #ff4757; border-radius: 50%;"></div>
                            `;
                            
                            messageItem.addEventListener('click', async () => {
                                // 先标记消息为已读
                                await markMessageAsRead(message.id);
                                
                                // 从通知列表中移除该消息
                                messageItem.remove();
                                
                                // 检查通知列表是否为空
                                const notificationList = document.getElementById('notificationList');
                                if (notificationList.children.length === 0) {
                                    notificationList.innerHTML = '<div style="padding: 16px; text-align: center; color: #90b0d1;">暂无未读消息</div>';
                                }
                                
                                // 如果是评论回复类型的消息，跳转到相关资源详情页
                                if (message.type === 'comment_reply' && message.resourceId) {
                                    window.location.href = `detail.html?id=${message.resourceId}`;
                                }
                            });
                            
                            notificationList.appendChild(messageItem);
                        });
                    }
                }
            }
        } catch (error) {
            console.error('获取未读消息列表失败:', error);
        }
    }
    
    // 标记消息为已读
    async function markMessageAsRead(messageId) {
        try {
            const response = await fetch(`/messages/read/${messageId}`, {
                method: 'POST'
            });
            if (response.ok) {
                // 重新获取未读消息数量
                if (savedUsername) {
                    getUnreadMessageCount(savedUsername);
                }
            }
        } catch (error) {
            console.error('标记消息为已读失败:', error);
        }
    }
    
    // 绑定消息图标点击事件
    document.getElementById('notificationIcon').addEventListener('click', function() {
        const dropdown = document.getElementById('notificationDropdown');
        if (dropdown.style.display === 'none' || dropdown.style.display === '') {
            dropdown.style.display = 'block';
            // 获取未读消息列表
            if (savedUsername) {
                getUnreadMessages(savedUsername);
            }
        } else {
            dropdown.style.display = 'none';
        }
    });
    
    // 点击其他地方关闭消息下拉菜单
    document.addEventListener('click', function(event) {
        const notificationIcon = document.getElementById('notificationIcon');
        const dropdown = document.getElementById('notificationDropdown');
        if (!notificationIcon.contains(event.target) && dropdown.style.display === 'block') {
            dropdown.style.display = 'none';
        }
    });
    
    // 绑定全部标记为已读按钮点击事件
    document.getElementById('markAllReadBtn').addEventListener('click', function() {
        // 获取所有未读消息并标记为已读
        if (savedUsername) {
            getUnreadMessages(savedUsername).then(() => {
                const messageItems = document.querySelectorAll('#notificationList > div');
                messageItems.forEach(item => {
                    if (item.querySelector('div:last-child')) {
                        item.querySelector('div:last-child').style.display = 'none';
                        item.style.background = 'rgba(90, 160, 255, 0.1)';
                    }
                });
                // 重新获取未读消息数量
                getUnreadMessageCount(savedUsername);
            });
        }
    });

    document.getElementById('userInfo').addEventListener('click', function() {
        if (savedUsername) {
            window.location.href = 'user.html'; // 如果有个人中心
        } else {
            alert('请先登录');
            window.location.href = 'index.html';
        }
    });

    // ========== 获取详情 ==========
    async function fetchDetail() {
        console.log('开始获取详情，资源ID:', id);
        const detailDiv = document.getElementById('detailContent');
        console.log('detailDiv元素:', detailDiv);

        if (!detailDiv) {
            console.error('找不到detailContent元素');
            return;
        }

        // 直接从服务器获取资源详情（不缓存，因为数据较大包含Base64头像）
        try {
            const url = `/resources/${id}`;
            console.log('请求URL:', url);
            const response = await fetch(url);
            console.log('响应状态:', response.status);

            if (!response.ok) {
                throw new Error(`HTTP error ${response.status}`);
            }
            const data = await response.json();
            console.log('后端返回数据:', data);
            
            // 资源详情数据较大（包含Base64头像），不再缓存到localStorage
            // 直接使用后端返回的数据
            
            renderDetail(data);
        } catch (error) {
            console.error('获取详情失败:', error);
            detailDiv.innerHTML = '<p style="color:#ff8a8a; text-align:center;">加载失败，请稍后重试</p>';
        }
    }

    function renderDetail(data) {
        console.log('renderDetail 接收到的数据:', data);

        // 提取 resource 和 comments
        let resource;
        let comments = [];
        if (data && data.resource) {
            resource = data.resource;
            comments = data.comments || [];
        } else {
            resource = data;
            if (data && data.comments) comments = data.comments;
        }

        if (!resource) {
            document.getElementById('detailContent').innerHTML = '<p style="color:#ff8a8a;">数据格式错误：缺少 resource</p>';
            return;
        }

        // 安全提取字段
        const title = resource.title || '无标题';
        const author = resource.author || '匿名';
        const category = resource.category || '未分类';
        const createdAt = resource.createdAt;
        const content = resource.content || '';
        const image = resource.image || '';

        // 安全格式化日期
        let createdDate = '未知';
        if (createdAt) {
            try {
                const date = new Date(createdAt);
                if (!isNaN(date.getTime())) {
                    createdDate = date.toLocaleString('zh-CN');
                } else {
                    createdDate = String(createdAt);
                }
            } catch (e) {
                createdDate = String(createdAt);
            }
        }

        console.log('渲染字段:', { title, author, category, createdDate, contentLength: content.length });

        // 构建 HTML（包含评论输入框）
        let coverImageHtml = image ? `<img class="article-cover" src="${image}" alt="${title}">` : '';
        let html = `
                <h1 class="article-title">${title}</h1>
                <div class="article-meta">
                    <span>作者：${escapeHtml(author)}</span> ·
                    <span>发布于：${createdDate}</span> ·
                    <span>分类：${escapeHtml(category)}</span>
                </div>
                ${coverImageHtml}
                <div class="article-content">
                    ${content ? escapeHtml(content).replace(/\n/g, '<br>') : '暂无内容'}
                </div>
                <div class="comment-section">
                    <h3 style="margin-bottom:20px;">评论 (${comments.length})</h3>
                    <!-- 新增评论输入区域 -->
                    <div class="comment-input-area">
                        <textarea id="commentContent" placeholder="写下你的评论..."></textarea>
                        <button id="submitCommentBtn">发表评论</button>
                    </div>
                    <div id="commentList">
                        ${renderComments(comments)}
                    </div>
                </div>
            `;
        document.getElementById('detailContent').innerHTML = html;
        console.log('渲染完成');

        // 绑定评论提交事件
        bindCommentSubmit();

        // 检查每个评论的点赞状态
        if (savedUsername && comments && comments.length > 0) {
            comments.forEach(comment => {
                checkUserLikedStatus(comment.id);
            });
        }
    }

    // 渲染评论（支持嵌套回复）
    function renderComments(comments, isReply = false) {
        if (!comments || comments.length === 0) return '';

        return comments.map(c => {
            const commentAuthor = c.author || '匿名';
            const commentContent = c.content || '';
            let commentDate = '未知';
            if (c.createdAt) {
                try {
                    const d = new Date(c.createdAt);
                    if (!isNaN(d.getTime())) commentDate = d.toLocaleString('zh-CN');
                    else commentDate = String(c.createdAt);
                } catch (e) {
                    commentDate = String(c.createdAt);
                }
            }

            // 获取回复
            const replies = c.replies || [];
            const replyCount = replies.length;
            const showReplies = replyCount <= 3;
            const hiddenReplyCount = Math.max(0, replyCount - 3);

            return `
                    <div class="comment-item ${isReply ? 'reply-item' : ''}" data-comment-id="${c.id}">
                        <div class="comment-header" style="display: flex; align-items: center; gap: 10px;">
                            <a href="profile.html?userName=${encodeURIComponent(commentAuthor)}" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
                                ${c.avatar ? `
                                <img src="${c.avatar}" alt="${escapeHtml(commentAuthor)}" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(90, 160, 255, 0.3);">
                                ` : `
                                <div style="width: 32px; height: 32px; background: linear-gradient(145deg, #1e4f9e, #6d3fc9); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 500; font-size: 1rem; box-shadow: 0 0 15px #3f6eff;">
                                    ${commentAuthor.charAt(0).toUpperCase()}
                                </div>
                                `}
                                <span class="comment-author" style="color: #b8dcff; font-weight: 600;">${escapeHtml(commentAuthor)}</span>
                            </a>
                            <span class="comment-time">${commentDate}</span>
                        </div>
                        <div class="comment-content">${escapeHtml(commentContent)}</div>
                        <div class="comment-actions">
                            <button class="like-btn" onclick="likeComment(${c.id})">
                                <i class="fa-solid fa-thumbs-up"></i>
                                <span class="like-count">${c.likes || 0}</span>
                            </button>
                            ${!isReply ? `<button class="reply-btn" onclick="toggleReplyForm(${c.id})">
                                <i class="fa-solid fa-reply"></i> 回复
                            </button>` : ''}
                        </div>
                        ${!isReply ? `
                        <div class="reply-form" id="reply-form-${c.id}" style="display: none;">
                            <textarea class="reply-textarea" placeholder="回复 ${escapeHtml(commentAuthor)}..." rows="3"></textarea>
                            <div class="reply-actions">
                                <button class="submit-reply-btn" onclick="submitReply(${c.id})">发表回复</button>
                                <button class="cancel-reply-btn" onclick="toggleReplyForm(${c.id})">取消</button>
                            </div>
                        </div>
                        ` : ''}

                        <!-- 回复列表 -->
                        ${replyCount > 0 ? `
                        <div class="replies-container">
                            ${renderComments(showReplies ? replies : replies.slice(0, 3), true)}
                            ${hiddenReplyCount > 0 ? `
                            <div class="show-more-replies">
                                <button class="show-more-btn" onclick="toggleAllReplies(${c.id})">
                                    点击查看剩余${hiddenReplyCount}条回复
                                </button>
                            </div>
                            ` : ''}
                        </div>
                        ` : ''}
                    </div>
                `;
        }).join('');
    }

    function bindCommentSubmit() {
        const submitBtn = document.getElementById('submitCommentBtn');
        if (submitBtn) {
            // 移除之前可能绑定的监听器，避免重复（简单起见，每次重新绑定）
            submitBtn.replaceWith(submitBtn.cloneNode(true)); // 清除旧事件
            const newBtn = document.getElementById('submitCommentBtn');
            newBtn.addEventListener('click', submitComment);
        }
    }

    async function submitComment() {
        // 检查登录
        if (!savedUsername) {
            alert('请先登录后再评论');
            return;
        }

        const contentInput = document.getElementById('commentContent');
        const content = contentInput.value.trim();
        if (!content) {
            alert('评论内容不能为空');
            return;
        }

        // 准备请求数据
        const commentData = {
            resourceId: parseInt(id),          // 资源ID
            author: savedUsername,              // 作者用户名
            content: content
        };

        try {
            const response = await fetch(`/resources/comment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(commentData)
            });

            if (!response.ok) {
                throw new Error(`HTTP error ${response.status}`);
            }

            const result = await response.json();
            console.log('评论提交成功:', result);

            // 清空输入框
            contentInput.value = '';

            // 刷新详情以显示新评论
            await fetchDetail();

            // 显示美观的成功提示
            showToast('评论发表成功！');

        } catch (error) {
            console.error('提交评论失败:', error);
            showToast('评论失败，请重试', 'error');
        }
    }

    function escapeHtml(unsafe) {
        if (!unsafe) return unsafe;
        return unsafe
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // ========== 点赞功能 ==========
    async function likeComment(commentId) {
        if (!savedUsername) {
            showToast('请先登录后再点赞', 'error');
            return;
        }

        try {
            const response = await fetch(`/resources/comment/${commentId}/like`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: savedUsername })
            });

            if (response.ok) {
                const result = await response.json();
                if (result.success) {
                    // 更新点赞数显示
                    const likeBtn = document.querySelector(`[data-comment-id="${commentId}"] .like-btn`);
                    const likeCount = likeBtn.querySelector('.like-count');

                    likeCount.textContent = result.likes || 0;

                    // 更新按钮状态
                    if (result.action === 'like') {
                        likeBtn.classList.add('active');
                        showToast('点赞成功！');
                    } else if (result.action === 'cancel') {
                        likeBtn.classList.remove('active');
                        showToast('取消点赞成功！');
                    }
                } else {
                    showToast(result.message || '点赞失败', 'error');
                }
            } else {
                showToast('点赞失败，请重试', 'error');
            }
        } catch (error) {
            console.error('点赞失败:', error);
            showToast('点赞失败，请检查网络连接', 'error');
        }
    }

    // 检查用户是否点赞过评论
    async function checkUserLikedStatus(commentId) {
        if (!savedUsername) return;

        try {
            const response = await fetch(`/resources/comment/${commentId}/user/${savedUsername}/liked`);
            if (response.ok) {
                const result = await response.json();
                if (result.success) {
                    const likeBtn = document.querySelector(`[data-comment-id="${commentId}"] .like-btn`);
                    const likeCount = likeBtn.querySelector('.like-count');

                    likeCount.textContent = result.likes || 0;

                    if (result.hasLiked) {
                        likeBtn.classList.add('active');
                    } else {
                        likeBtn.classList.remove('active');
                    }
                }
            }
        } catch (error) {
            console.error('检查点赞状态失败:', error);
        }
    }

    // 回复功能
    function toggleReplyForm(commentId) {
        if (!savedUsername) {
            alert('请先登录后再回复');
            return;
        }

        const replyForm = document.getElementById(`reply-form-${commentId}`);
        if (replyForm.style.display === 'none') {
            replyForm.style.display = 'block';
            // 自动聚焦到输入框
            setTimeout(() => {
                const textarea = replyForm.querySelector('.reply-textarea');
                textarea.focus();
            }, 100);
        } else {
            replyForm.style.display = 'none';
            // 清空输入框
            const textarea = replyForm.querySelector('.reply-textarea');
            textarea.value = '';
        }
    }

    async function submitReply(commentId) {
        if (!savedUsername) {
            alert('请先登录后再回复');
            return;
        }

        const replyForm = document.getElementById(`reply-form-${commentId}`);
        const textarea = replyForm.querySelector('.reply-textarea');
        const content = textarea.value.trim();

        if (!content) {
            alert('回复内容不能为空');
            return;
        }

        try {
            const replyData = {
                resourceId: parseInt(id),
                author: savedUsername,
                content: content,
                parentId: commentId  // 设置父评论ID
            };

            const response = await fetch(`/resources/comment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(replyData)
            });

            if (response.ok) {
                // 隐藏回复表单
                replyForm.style.display = 'none';
                textarea.value = '';

                // 刷新页面显示新回复
                await fetchDetail();

                // 显示美观的成功提示
                showToast('回复发表成功！');
            } else {
                showToast('回复发表失败，请重试', 'error');
            }
        } catch (error) {
            console.error('回复失败:', error);
            showToast('回复失败，请检查网络连接', 'error');
        }
    }

    // 展开/折叠所有回复
    function toggleAllReplies(commentId) {
        const commentItem = document.querySelector(`[data-comment-id="${commentId}"]`);
        const showMoreBtn = commentItem.querySelector('.show-more-btn');
        const repliesContainer = commentItem.querySelector('.replies-container');

        // 重新渲染该评论的所有回复
        fetchDetail();
    }

    fetchDetail();

    // ========== 背景 canvas ==========
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let mouseX = -1000, mouseY = -1000;
    let width, height;

    function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    const particles = [];
    for (let i = 0; i < 70; i++) {
        particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.2,
            vy: (Math.random() - 0.5) * 0.2,
            size: Math.random() * 2 + 1,
        });
    }

    function draw() {
        if (!ctx) return;
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#0b0e14';
        ctx.fillRect(0, 0, width, height);
        ctx.shadowColor = '#5f9eff';
        ctx.shadowBlur = 12;
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;

            let dist = Math.hypot(mouseX - p.x, mouseY - p.y);
            let brightness = 0.3;
            if (dist < 200) brightness = 0.9 - dist / 400;
            brightness = Math.min(0.8, Math.max(0.2, brightness));

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * brightness * 1.5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(180, 220, 255, ${brightness})`;
            ctx.fill();
        });

        let gradient = ctx.createRadialGradient(mouseX, mouseY, 20, mouseX, mouseY, 400);
        gradient.addColorStop(0, 'rgba(100, 180, 255, 0.15)');
        gradient.addColorStop(0.6, 'rgba(40, 100, 200, 0.02)');
        gradient.addColorStop(1, 'transparent');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = 'rgba(255,255,255,0.01)';
        ctx.fillRect(0, 0, width, height);

        requestAnimationFrame(draw);
    }
    draw();

    document.addEventListener('mouseleave', () => {
        mouseX = -1000; mouseY = -1000;
    });
</script>
</body>
</html>
